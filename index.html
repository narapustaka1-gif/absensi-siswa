<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Attendance | SMA Bahagia</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.185/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --accent: #10b981;
            --danger: #ef4444;
            --glass: rgba(255, 255, 255, 0.92);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container { width: 100%; max-width: 480px; position: relative; }

        /* Card Aesthetic */
        .card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            border-radius: 35px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.3);
            margin-top: 15px;
            animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .hidden { display: none !important; }

        /* Typography */
        h1 { color: white; text-align: center; font-weight: 800; font-size: 1.8rem; letter-spacing: -1px; }
        .school-info { color: #94a3b8; text-align: center; font-size: 0.75rem; letter-spacing: 3px; margin-bottom: 10px; font-weight: 600; }

        /* List Live Data */
        .live-container { margin-top: 20px; max-height: 380px; overflow-y: auto; padding-right: 5px; }
        .item {
            background: white; border-radius: 22px; padding: 14px; margin-bottom: 12px;
            display: flex; align-items: center; gap: 14px; border: 1px solid #f1f5f9;
            transition: 0.3s;
        }
        .item img { width: 55px; height: 55px; border-radius: 16px; object-fit: cover; border: 2px solid #f1f5f9; }
        .info { flex: 1; }
        .info b { font-size: 0.95rem; color: #1e293b; display: block; }
        .info span { font-size: 0.75rem; color: #64748b; font-weight: 500; }
        .status-badge { font-size: 0.65rem; font-weight: 800; padding: 5px 10px; border-radius: 10px; text-transform: uppercase; }
        .sh { background: #dcfce7; color: #10b981; }
        .st { background: #fee2e2; color: #ef4444; }

        /* Button UI */
        .btn {
            width: 100%; padding: 18px; border-radius: 18px; border: none; font-weight: 700;
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 12px;
        }
        .btn-main { background: var(--primary); color: white; box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4); }
        .btn-white { background: white; color: var(--primary); border: 2px solid #e2e8f0; }
        .btn-back { background: transparent; color: #64748b; font-size: 0.85rem; }

        /* Input UI */
        .field { margin-bottom: 18px; }
        .field label { display: block; font-size: 0.7rem; font-weight: 800; color: #475569; margin-bottom: 6px; padding-left: 5px; }
        input, select { width: 100%; padding: 16px; border-radius: 15px; border: 2px solid #e2e8f0; background: white; font-size: 1rem; outline: none; }
        input:focus { border-color: var(--primary); }

        /* Toast Notif */
        #toast {
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
            background: #1e293b; color: white; padding: 14px 28px; border-radius: 50px;
            font-weight: 600; z-index: 2000; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: none; font-size: 0.9rem;
        }

        /* Footer */
        .footer { margin-top: 40px; text-align: center; color: white; font-size: 0.8rem; opacity: 0.8; }
        .footer span { display: block; font-weight: 800; color: #818cf8; margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="toast"></div>

    <div class="container">
        <div class="school-info">SMA BAHAGIA INDONESIA</div>
        <h1>ABSENSI DIGITAL</h1>

        <!-- HALAMAN 1: LIST ABSENSI TERBARU (REALTIME) -->
        <div id="viewLive" class="card">
            <h2 style="font-size: 1.2rem; margin-bottom: 15px; text-align: center;">Daftar Hadir Siswa</h2>
            <div id="listLive" class="live-container"></div>
            <div style="margin-top: 25px;">
                <button class="btn btn-main" onclick="nav('viewNIS')">Mulai Absen</button>
                <button class="btn btn-white" onclick="nav('viewLogin')">Portal Guru</button>
            </div>
        </div>

        <!-- HALAMAN 2: INPUT NIS -->
        <div id="viewNIS" class="card hidden">
            <h2 style="text-align: center; margin-bottom: 20px;">Verifikasi Diri</h2>
            <div class="field">
                <label>NOMOR INDUK SISWA</label>
                <input type="number" id="inNIS" placeholder="Masukkan NIS Anda">
            </div>
            <button class="btn btn-main" onclick="nav('viewForm')">Lanjutkan</button>
            <button class="btn btn-back" onclick="nav('viewLive')">Batal</button>
        </div>

        <!-- HALAMAN 3: FORM DATA -->
        <div id="viewForm" class="card hidden">
            <h2 style="text-align: center; margin-bottom: 20px;">Lengkapi Profil</h2>
            <div class="field"><label>NAMA LENGKAP</label><input type="text" id="inNama" placeholder="Nama Anda"></div>
            <div class="field"><label>KELAS</label><select id="inKelas"><option>X - Bahagia</option><option>XI - Bahagia</option><option>XII - Bahagia</option></select></div>
            <button class="btn btn-white" onclick="camera()">📸 Foto Selfie</button>
            <img id="preview" style="width:100%; border-radius:20px; margin:15px 0; display:none; border: 3px solid white;">
            <button id="btnSend" class="btn btn-main hidden" onclick="saveAbsen()">Kirim Sekarang</button>
            <button class="btn btn-back" onclick="nav('viewNIS')">Kembali</button>
        </div>

        <!-- HALAMAN 4: LOGIN GURU -->
        <div id="viewLogin" class="card hidden">
            <h2 style="text-align: center; margin-bottom: 20px;">Akses Admin</h2>
            <div class="field"><input type="text" id="user" placeholder="Username"></div>
            <div class="field"><input type="text" id="nick" placeholder="Panggilan"></div>
            <div class="field"><input type="password" id="pass" placeholder="Password"></div>
            <button class="btn btn-main" onclick="login()">Buka Website</button>
            <button class="btn btn-back" onclick="nav('viewLive')">Kembali</button>
        </div>

        <!-- HALAMAN 5: DASHBOARD GURU -->
        <div id="viewDash" class="card hidden">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2 style="font-size:1.1rem;">Dashboard Guru</h2>
                <button onclick="logout()" style="color:var(--danger); border:none; background:none; font-weight:800; cursor:pointer;">KELUAR</button>
            </div>

            <div id="listDash" class="live-container"></div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:20px;">
                <button class="btn btn-white" style="margin:0; font-size:0.7rem;" onclick="exportExcel()">📊 EXCEL</button>
                <button class="btn btn-white" style="margin:0; font-size:0.7rem;" onclick="exportPDF()">📄 PDF</button>
            </div>
            
            <div style="background:#f1f5f9; padding:15px; border-radius:20px; margin-top:15px; text-align:center;">
                <p style="font-size:0.65rem; font-weight:800; color:#64748b; margin-bottom:10px;">KONTROL AKSES SISWA</p>
                <div style="display:flex; gap:8px;">
                    <button class="btn btn-main" style="margin:0; background:var(--danger); flex:1;" onclick="setGate(true)">KUNCI</button>
                    <button class="btn btn-main" style="margin:0; background:var(--accent); flex:1;" onclick="setGate(false)">BUKA</button>
                </div>
            </div>
        </div>

        <div class="footer">
            Hak Cipta © 2026
            <span>dibuat oleh Deby Verona</span>
        </div>
    </div>

<script>
    let currentPhoto = "";

    // REAL-TIME LISTENER (Supaya data langsung masuk tanpa refresh)
    window.addEventListener('storage', (e) => {
        if (e.key === 'db_verona') {
            renderData();
        }
    });

    // SISTEM STANDBY (Navigasi tetap di halaman terakhir)
    function nav(id) {
        document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        localStorage.setItem('activePage', id);
        if(id === 'viewLive' || id === 'viewDash') renderData();
    }

    window.onload = () => {
        const savedPage = localStorage.getItem('activePage') || 'viewLive';
        const isGuru = sessionStorage.getItem('isGuru');
        
        if (isGuru === 'true' && savedPage === 'viewDash') {
            nav('viewDash');
        } else {
            nav('viewLive');
        }
    };

    function showToast(m) {
        const t = document.getElementById('toast');
        t.innerText = m; t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    }

    // SISWA FUNCTIONS
    function camera() {
        const i = document.createElement('input'); i.type='file'; i.accept='image/*'; i.capture='user';
        i.onchange = e => {
            const r = new FileReader();
            r.onload = f => {
                currentPhoto = f.target.result;
                const p = document.getElementById('preview');
                p.src = currentPhoto; p.style.display = 'block';
                document.getElementById('btnSend').classList.remove('hidden');
            };
            r.readAsDataURL(e.target.files[0]);
        };
        i.click();
    }

    function saveAbsen() {
        const n = document.getElementById('inNama').value;
        const k = document.getElementById('inKelas').value;
        const isLocked = localStorage.getItem('gateLocked') === 'true';

        if(isLocked) return showToast("Maaf, Absensi sudah dikunci guru!");
        if(!n) return showToast("Nama harus diisi!");

        const d = new Date();
        const jam = d.getHours().toString().padStart(2,'0') + ":" + d.getMinutes().toString().padStart(2,'0');
        const st = d.getHours() >= 8 ? "Terlambat" : "Hadir";

        let db = JSON.parse(localStorage.getItem('db_verona')) || [];
        db.push({n, k, jam, st, p:currentPhoto});
        localStorage.setItem('db_verona', JSON.stringify(db)); // Trigger storage listener
        
        showToast("Absensi Berhasil Terkirim!");
        nav('viewLive');
    }

    // GURU FUNCTIONS
    function login() {
        if(document.getElementById('user').value === "deby verona" && 
           document.getElementById('nick').value === "vero" && 
           document.getElementById('pass').value === "patrobas") {
            sessionStorage.setItem('isGuru', 'true');
            nav('viewDash');
            showToast("Selamat Datang, Admin!");
        } else { showToast("Login Gagal!"); }
    }

    function renderData() {
        const db = JSON.parse(localStorage.getItem('db_verona')) || [];
        const targets = [document.getElementById('listLive'), document.getElementById('listDash')];
        
        targets.forEach(t => {
            if(!t) return;
            t.innerHTML = db.length ? "" : "<p style='text-align:center; font-size:0.8rem; color:#94a3b8; margin:30px 0;'>Menunggu data masuk...</p>";
            [...db].reverse().forEach(s => {
                t.innerHTML += `
                    <div class="item">
                        <img src="${s.p}">
                        <div class="info">
                            <b>${s.n}</b>
                            <span>${s.k} • ${s.jam} WIB</span>
                        </div>
                        <div class="status-badge ${s.st==='Hadir'?'sh':'st'}">${s.st}</div>
                    </div>`;
            });
        });
    }

    function setGate(v) {
        localStorage.setItem('gateLocked', v);
        showToast(v ? "Sistem Absensi Dikunci" : "Sistem Absensi Dibuka");
    }

    function logout() {
        sessionStorage.clear();
        localStorage.removeItem('activePage');
        location.reload();
    }

    // EXPORT
    function exportExcel() {
        const db = JSON.parse(localStorage.getItem('db_verona')) || [];
        const ws = XLSX.utils.json_to_sheet(db.map(s => ({Nama:s.n, Kelas:s.k, Jam:s.jam, Status:s.st})));
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Laporan");
        XLSX.writeFile(wb, "Absensi_SMA_Bahagia.xlsx");
    }

    function exportPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const db = JSON.parse(localStorage.getItem('db_verona')) || [];
        doc.text("Laporan Absensi SMA Bahagia", 14, 15);
        doc.autoTable({ head:[['Nama','Kelas','Jam','Status']], body:db.map(s=>[s.n, s.k, s.jam, s.st]), startY:20 });
        doc.save("Laporan_Absensi.pdf");
    }
</script>
</body>
</html>
