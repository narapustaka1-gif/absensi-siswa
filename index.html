<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Absensi Terverifikasi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container { width: 100%; max-width: 400px; }
        .card {
            background: white;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: all 0.4s ease;
        }
        .title {
            text-align: center;
            color: #1a73e8;
            margin-bottom: 25px;
            font-weight: 800;
        }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: #444; }
        input, select {
            width: 100%; padding: 12px 16px; border: 2px solid #eee; border-radius: 12px;
            font-size: 1rem; outline: none; transition: 0.3s;
        }
        input:focus { border-color: #1a73e8; }
        
        .btn {
            width: 100%; padding: 15px; border: none; border-radius: 12px;
            font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.3s;
        }
        .btn-primary { background: #1a73e8; color: white; }
        .btn-camera { background: #f8f9fa; color: #1a73e8; border: 2px dashed #1a73e8; margin-top: 10px; }
        .btn-success { background: #34a853; color: white; margin-top: 20px; }

        .hidden { display: none; }
        
        /* Layar Sukses */
        .success-screen { text-align: center; }
        .success-icon { font-size: 50px; color: #34a853; margin-bottom: 15px; }
        .timestamp { background: #f8f9fa; padding: 15px; border-radius: 12px; margin-top: 20px; font-family: monospace; }
        
        #photoPreview {
            width: 100%; max-height: 200px; object-fit: cover; 
            border-radius: 12px; margin-top: 15px; display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. LAYAR LOGIN -->
    <div id="stepLogin" class="card">
        <h2 class="title">Masuk Akun</h2>
        <div class="form-group">
            <label>Email / NIS</label>
            <input type="text" id="logEmail" placeholder="admin@demo.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="logPass" placeholder="123">
        </div>
        <button class="btn btn-primary" onclick="handleLogin()">Login</button>
    </div>

    <!-- 2. LAYAR ISI DATA (SETELAH LOGIN) -->
    <div id="stepForm" class="card hidden">
        <h2 class="title">Lengkapi Data</h2>
        <div class="form-group">
            <label>Nama Lengkap</label>
            <input type="text" id="absNama" placeholder="Masukkan nama...">
        </div>
        <div class="form-group">
            <label>Kelas</label>
            <select id="absKelas">
                <option value="X">Kelas X</option>
                <option value="XI">Kelas XI</option>
                <option value="XII">Kelas XII</option>
            </select>
        </div>
        <div class="form-group">
            <label>Status Kehadiran</label>
            <select id="absKet">
                <option value="Tepat Waktu">Tepat Waktu</option>
                <option value="Terlambat">Terlambat</option>
                <option value="Tidak Terlambat">Tidak Terlambat</option>
            </select>
        </div>
        
        <button class="btn btn-camera" onclick="handleCapture()">📸 Ambil Foto (Google Lens Mode)</button>
        <img id="photoPreview" alt="Preview">
        
        <button class="btn btn-success" id="btnSubmit" onclick="handleSubmit()">Kirim Absensi</button>
    </div>

    <!-- 3. LAYAR BERHASIL & TERKUNCI -->
    <div id="stepFinal" class="card hidden success-screen">
        <div class="success-icon">✔</div>
        <h2 style="color: #34a853;">Absensi Berhasil!</h2>
        <p id="congratsText" style="margin-top: 10px; color: #666;"></p>
        
        <div class="timestamp">
            <p><strong>Waktu:</strong> <span id="resTime"></span></p>
            <p><strong>Status:</strong> <span id="resKet"></span></p>
        </div>
        
        <p style="margin-top: 25px; font-size: 0.75rem; color: #e74c3c; font-weight: bold;">
            🔒 Akses Terkunci. Anda sudah melakukan absensi hari ini.
        </p>
    </div>
</div>

<script>
    let userData = null;
    let userPhoto = null;

    // Cek jika sudah pernah absen hari ini (Kunci Otomatis)
    window.onload = () => {
        const lock = localStorage.getItem('absensi_lock');
        const today = new Date().toLocaleDateString();
        if (lock === today) {
            showStep('stepFinal');
            document.getElementById('congratsText').innerText = "Selamat, data Anda sudah tersimpan di sistem kami.";
            document.getElementById('resTime').innerText = localStorage.getItem('last_time');
            document.getElementById('resKet').innerText = localStorage.getItem('last_ket');
        }
    };

    function showStep(id) {
        document.getElementById('stepLogin').classList.add('hidden');
        document.getElementById('stepForm').classList.add('hidden');
        document.getElementById('stepFinal').classList.add('hidden');
        document.getElementById(id).classList.remove('hidden');
    }

    // 1. Logic Login
    function handleLogin() {
        const email = document.getElementById('logEmail').value;
        const pass = document.getElementById('logPass').value;

        // Simple bypass untuk demo (admin@demo.com / 123)
        if(email === "admin@demo.com" && pass === "123") {
            showStep('stepForm');
        } else {
            alert("Email atau password salah! (Coba admin@demo.com / 123)");
        }
    }

    // 2. Logic Ambil Foto
    function handleCapture() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.capture = 'user'; // Memicu kamera HP
        
        input.onchange = (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (event) => {
                userPhoto = event.target.result;
                const imgTag = document.getElementById('photoPreview');
                imgTag.src = userPhoto;
                imgTag.style.display = 'block';
            };
            reader.readAsDataURL(file);
        };
        input.click();
    }

    // 3. Logic Submit
    function handleSubmit() {
        const nama = document.getElementById('absNama').value;
        const ket = document.getElementById('absKet').value;
        
        if(!nama || !userPhoto) {
            alert("Mohon isi nama dan ambil foto selfie dulu!");
            return;
        }

        const now = new Date();
        const timeStr = now.toLocaleTimeString('id-ID');
        const dateStr = now.toLocaleDateString();

        // Simpan status "Locked" ke LocalStorage
        localStorage.setItem('absensi_lock', dateStr);
        localStorage.setItem('last_time', timeStr);
        localStorage.setItem('last_ket', ket);

        // Tampilkan layar sukses
        document.getElementById('congratsText').innerText = `Selamat ${nama}, anda telah berhasil melakukan absensi!`;
        document.getElementById('resTime').innerText = timeStr;
        document.getElementById('resKet').innerText = ket;
        
        showStep('stepFinal');
    }
</script>

</body>
</html>
