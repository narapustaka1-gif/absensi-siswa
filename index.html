<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi SMA Bahagia</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.185/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root { --p: #4f46e5; --a: #10b981; --d: #ef4444; --w: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #0f172a; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 15px; overflow-x: hidden; }
        
        .container { width: 100%; max-width: 450px; }
        .card { background: rgba(255,255,255,0.98); border-radius: 28px; padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); margin-top: 15px; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        h1 { color: white; text-align: center; font-weight: 800; font-size: 1.6rem; margin-bottom: 5px; }
        .hidden { display: none !important; }
        
        /* List Items */
        .list-area { margin-top: 15px; max-height: 400px; overflow-y: auto; padding-right: 5px; }
        .item { background: #f8fafc; border-radius: 18px; padding: 12px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; border: 1px solid #e2e8f0; }
        .item img { width: 52px; height: 52px; border-radius: 12px; object-fit: cover; background: #ddd; }
        .info { flex: 1; }
        .info b { font-size: 0.9rem; color: #1e293b; display: block; text-transform: capitalize; }
        .info span { font-size: 0.75rem; color: #64748b; font-weight: 500; }
        .badge { font-size: 0.65rem; font-weight: 800; padding: 5px 10px; border-radius: 8px; text-transform: uppercase; }
        .bh { background: #dcfce7; color: #10b981; }
        .bt { background: #fee2e2; color: #ef4444; }

        /* Buttons & Inputs */
        .btn { width: 100%; padding: 16px; border-radius: 16px; border: none; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; margin-top: 10px; }
        .btn:active { transform: scale(0.98); }
        .btn-p { background: var(--p); color: white; }
        .btn-w { background: white; color: var(--p); border: 2px solid var(--p); }
        input, select { width: 100%; padding: 15px; border-radius: 14px; border: 2px solid #e2e8f0; font-size: 1rem; margin-top: 8px; outline: none; background: white; }
        
        #toast { position: fixed; top: 20px; background: #1e293b; color: white; padding: 12px 25px; border-radius: 50px; font-weight: 700; z-index: 9999; display: none; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .footer { margin-top: 30px; text-align: center; color: rgba(255,255,255,0.7); font-size: 0.8rem; }
        .footer b { display: block; color: #818cf8; margin-top: 4px; letter-spacing: 1px; }
    </style>
</head>
<body>

<div id="toast"></div>

<div class="container">
    <h1>SMA BAHAGIA</h1>
    <p style="color:#94a3b8; text-align:center; font-size:0.7rem; letter-spacing:2px; font-weight:600;">SISTEM REALTIME v2.0</p>

    <!-- HALAMAN LIVE FEED (HOME) -->
    <div id="pLive" class="card">
        <h2 style="font-size:1.1rem; text-align:center; color:#1e293b;">Daftar Hadir Terkini</h2>
        <div id="listLive" class="list-area"></div>
        <button class="btn btn-p" onclick="nav('pNIS')">Masuk Absensi</button>
        <button class="btn btn-w" onclick="nav('pLogin')">Portal Guru</button>
    </div>

    <!-- HALAMAN VERIF NIS -->
    <div id="pNIS" class="card hidden">
        <h2 style="text-align:center;">Nomor Induk</h2>
        <input type="number" id="inNIS" placeholder="Masukkan NIS">
        <button class="btn btn-p" onclick="nav('pForm')">Lanjutkan</button>
        <button class="btn btn-w" onclick="nav('pLive')" style="border:none;">Kembali</button>
    </div>

    <!-- HALAMAN FORM ABSEN -->
    <div id="pForm" class="card hidden">
        <h2 style="text-align:center;">Lengkapi Data</h2>
        <input type="text" id="inNama" placeholder="Nama Lengkap">
        <select id="inKelas"><option>X - Bahagia</option><option>XI - Bahagia</option><option>XII - Bahagia</option></select>
        <button class="btn btn-w" onclick="openCam()">📸 Ambil Foto Selfie</button>
        <img id="preview" style="width:100%; border-radius:18px; margin:15px 0; display:none; border:2px solid #e2e8f0;">
        <button id="btnKirim" class="btn btn-p hidden" onclick="prosesAbsen()">Kirim Kehadiran</button>
        <button class="btn btn-w" onclick="nav('pNIS')" style="border:none;">Kembali</button>
    </div>

    <!-- HALAMAN LOGIN GURU -->
    <div id="pLogin" class="card hidden">
        <h2 style="text-align:center;">Admin Login</h2>
        <input type="text" id="u" placeholder="Username">
        <input type="text" id="n" placeholder="Panggilan">
        <input type="password" id="p" placeholder="Password">
        <button class="btn btn-p" onclick="doLogin()">Masuk Dashboard</button>
        <button class="btn btn-w" onclick="nav('pLive')" style="border:none;">Kembali</button>
    </div>

    <!-- HALAMAN DASHBOARD -->
    <div id="pDash" class="card hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h2 style="font-size:1.1rem;">Panel Guru</h2>
            <button onclick="doLogout()" style="color:var(--d); border:none; background:none; font-weight:800; font-size:0.8rem;">LOGOUT</button>
        </div>
        <div id="listDash" class="list-area"></div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:15px;">
            <button class="btn btn-w" style="font-size:0.8rem;" onclick="expXL()">📊 EXCEL</button>
            <button class="btn btn-w" style="font-size:0.8rem;" onclick="expPDF()">📄 PDF</button>
        </div>
    </div>

    <div class="footer">Hak Cipta © 2026 <b>dibuat oleh Deby Verona</b></div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
    let photoStr = "";

    // SINKRONISASI NAVIGASI & STANDBY
    function nav(id) {
        document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
        const target = document.getElementById(id);
        if(target) target.classList.remove('hidden');
        
        localStorage.setItem('current_pos', id);
        if(id === 'pLive' || id === 'pDash') render();
    }

    // AUTO STANDBY SAAT REFRESH
    window.onload = () => {
        const last = localStorage.getItem('current_pos') || 'pLive';
        const isAuth = sessionStorage.getItem('is_auth');
        
        if(isAuth === 'true' && last === 'pDash') {
            nav('pDash');
        } else {
            nav(last === 'pLogin' ? 'pLive' : last);
        }
    };

    function showMsg(t) {
        const x = document.getElementById('toast');
        x.innerText = t; x.style.display = 'block';
        setTimeout(() => x.style.display = 'none', 3000);
    }

    // KAMERA & KOMPRESI (ANTI DELAY)
    function openCam() {
        const fileIn = document.createElement('input'); fileIn.type = 'file'; fileIn.accept = 'image/*'; fileIn.capture = 'user';
        fileIn.onchange = e => {
            const reader = new FileReader();
            reader.onload = event => {
                const img = new Image();
                img.onload = () => {
                    const cvs = document.getElementById('canvas');
                    const ctx = cvs.getContext('2d');
                    const scale = 350 / img.width;
                    cvs.width = 350; cvs.height = img.height * scale;
                    ctx.drawImage(img, 0, 0, cvs.width, cvs.height);
                    photoStr = cvs.toDataURL('image/jpeg', 0.6);
                    document.getElementById('preview').src = photoStr;
                    document.getElementById('preview').style.display = 'block';
                    document.getElementById('btnKirim').classList.remove('hidden');
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        };
        fileIn.click();
    }

    // PROSES SIMPAN REALTIME
    function prosesAbsen() {
        const nama = document.getElementById('inNama').value;
        const kelas = document.getElementById('inKelas').value;
        if(!nama) return showMsg("Nama wajib diisi!");

        const d = new Date();
        const jam = d.getHours().toString().padStart(2,'0') + ":" + d.getMinutes().toString().padStart(2,'0');
        const status = d.getHours() >= 8 ? "Terlambat" : "Hadir";

        const dataBaru = { n: nama, k: kelas, j: jam, s: status, p: photoStr };
        let db = JSON.parse(localStorage.getItem('absensi_db_verona')) || [];
        db.push(dataBaru);
        
        localStorage.setItem('absensi_db_verona', JSON.stringify(db));
        showMsg("Berhasil Terkirim!");
        
        // Reset Form & Back
        document.getElementById('inNama').value = "";
        document.getElementById('preview').style.display = 'none';
        document.getElementById('btnKirim').classList.add('hidden');
        nav('pLive');
    }

    function doLogin() {
        if(document.getElementById('u').value === "deby verona" && 
           document.getElementById('n').value === "vero" && 
           document.getElementById('p').value === "patrobas") {
            sessionStorage.setItem('is_auth', 'true');
            nav('pDash');
        } else { showMsg("Login Gagal!"); }
    }

    // RENDER DATA (RESPONSIF & TANPA DELAY)
    function render() {
        const db = JSON.parse(localStorage.getItem('absensi_db_verona')) || [];
        const t1 = document.getElementById('listLive');
        const t2 = document.getElementById('listDash');
        
        const html = db.length === 0 ? "<p style='text-align:center; padding:20px; color:#94a3b8; font-size:0.8rem;'>Belum ada data masuk.</p>" : 
        [...db].reverse().map(x => `
            <div class="item">
                <img src="${x.p}">
                <div class="info"><b>${x.n}</b><span>${x.k} • ${x.j} WIB</span></div>
                <div class="badge ${x.s==='Hadir'?'bh':'bt'}">${x.s}</div>
            </div>
        `).join('');

        if(t1) t1.innerHTML = html;
        if(t2) t2.innerHTML = html;
    }

    // AUTO UPDATE JIKA ADA DATA BARU DARI HP LAIN
    window.addEventListener('storage', (e) => {
        if(e.key === 'absensi_db_verona') render();
    });

    function doLogout() {
        sessionStorage.clear();
        localStorage.removeItem('current_pos');
        location.reload();
    }

    // EXPORT FUNCTIONS
    function expXL() {
        const db = JSON.parse(localStorage.getItem('absensi_db_verona')) || [];
        const ws = XLSX.utils.json_to_sheet(db.map(i=>({Nama:i.n, Kelas:i.k, Jam:i.j, Status:i.s})));
        const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Absen");
        XLSX.writeFile(wb, "Data_Absensi_SMA.xlsx");
    }

    function expPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const db = JSON.parse(localStorage.getItem('absensi_db_verona')) || [];
        doc.text("Laporan Absensi SMA Bahagia", 14, 15);
        doc.autoTable({ head:[['Nama','Kelas','Jam','Status']], body:db.map(i=>[i.n,i.k,i.j,i.s]), startY:20 });
        doc.save("Laporan_Absen.pdf");
    }
</script>
</body>
</html>
