<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Pro - Integrated</title>
    <style>
        :root {
            --primary: #4361ee;
            --success: #2ec4b6;
            --danger: #e71d36;
            --dark: #2b2d42;
            --light: #f8f9fa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #f0f2f5; color: var(--dark); line-height: 1.6; }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .hidden { display: none; }

        /* Card Styles */
        .card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); margin-bottom: 20px; border: 1px solid rgba(0,0,0,0.05); }
        .title { font-size: 1.5rem; font-weight: 800; margin-bottom: 10px; color: var(--primary); text-align: center; }

        /* Form Styles */
        input, select { width: 100%; padding: 12px 15px; margin: 10px 0 20px; border: 2px solid #edf2f4; border-radius: 12px; font-size: 1rem; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); }
        label { font-weight: 700; font-size: 0.85rem; color: #666; }

        /* Button Styles */
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: white; border: 2px solid var(--primary); color: var(--primary); }
        .btn-danger { background: var(--danger); color: white; }

        /* Status Badges */
        .badge { padding: 5px 12px; border-radius: 8px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }
        .bg-danger { background: #ffe5e5; color: var(--danger); }
        .bg-success { background: #e7fbf3; color: var(--success); }

        /* Guru Dashboard specific */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-box { background: white; padding: 15px; border-radius: 15px; text-align: center; border-bottom: 4px solid var(--primary); }
        .table-wrapper { overflow-x: auto; background: white; border-radius: 15px; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { background: #f8f9fa; padding: 15px; text-align: left; font-size: 0.8rem; color: #888; }
        td { padding: 15px; border-bottom: 1px solid #f1f1f1; font-size: 0.9rem; cursor: pointer; }
        .img-table { width: 45px; height: 45px; border-radius: 10px; object-fit: cover; }

        /* Modal */
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); display:none; justify-content:center; align-items:center; z-index:1000; padding: 20px; }
        .modal-content { background:white; width:100%; max-width:400px; border-radius:25px; overflow:hidden; position:relative; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- 1. ROLE SELECTION -->
    <div id="viewRole" class="card">
        <h1 class="title">Sistem Absensi v4.0</h1>
        <p style="text-align:center; color:#666; margin-bottom:30px;">Silakan pilih akses masuk:</p>
        <button class="btn btn-primary" onclick="showView('viewSiswa')" style="margin-bottom:15px;">Portal Siswa</button>
        <button class="btn btn-outline" onclick="showView('viewLoginGuru')">Dashboard Guru (Private)</button>
    </div>

    <!-- 2. LOGIN GURU (PRIVATE) -->
    <div id="viewLoginGuru" class="card hidden">
        <h2 class="title">Verifikasi Admin</h2>
        <div class="form-group">
            <label>Email</label>
            <input type="text" id="logEmail" placeholder="">
            <label>Nama</label>
            <input type="text" id="logNama" placeholder="">
            <label>Kata Sandi</label>
            <input type="password" id="logPass" placeholder="">
        </div>
        <button class="btn btn-primary" onclick="authGuru()">Masuk Dashboard</button>
        <button onclick="showView('viewRole')" style="margin-top:15px; background:none; border:none; color:gray; cursor:pointer; width:100%;">Kembali</button>
    </div>

    <!-- 3. VIEW SISWA -->
    <div id="viewSiswa" class="card hidden">
        <h2 class="title">Absensi Siswa</h2>
        <div style="background:#f0f4ff; padding:10px; border-radius:10px; font-size:0.8rem; margin-bottom:15px; text-align:center;">
            Batas Tepat Waktu: <strong>08:00 WIB</strong>
        </div>
        <input type="text" id="inNama" placeholder="Nama Lengkap">
        <select id="inKelas">
            <option>X - RPL</option>
            <option>XI - TKJ</option>
            <option>XII - Multimedia</option>
        </select>
        <button class="btn btn-outline" onclick="openCamera()">📸 Ambil Selfie</button>
        <img id="previewFoto" style="width:100%; border-radius:15px; margin: 15px 0; display:none;">
        <button id="btnSubmit" class="btn btn-primary hidden" onclick="prosesAbsenSiswa()">Kirim Absen</button>
        <button onclick="showView('viewRole')" style="margin-top:10px; border:none; background:none; color:gray; cursor:pointer; width:100%;">Batal</button>
    </div>

    <!-- 4. DASHBOARD GURU -->
    <div id="viewGuru" class="card hidden" style="max-width: 900px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2 style="color:var(--primary)">Panel Guru</h2>
            <button onclick="logoutGuru()" class="badge bg-danger" style="border:none; cursor:pointer;">Logout</button>
        </div>

        <div class="stats-grid">
            <div class="stat-box"><h3>Total</h3><p id="sTotal">0</p></div>
            <div class="stat-box" style="border-color:var(--success)"><h3>Tepat</h3><p id="sTepat" style="color:var(--success)">0</p></div>
            <div class="stat-box" style="border-color:var(--danger)"><h3>Lambat</h3><p id="sLambat" style="color:var(--danger)">0</p></div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Foto</th>
                        <th>Siswa</th>
                        <th>Jam</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="bodyTabelGuru"></tbody>
            </table>
        </div>
    </div>

    <!-- MODAL DETAIL -->
    <div id="modalDetail" class="modal" onclick="this.style.display='none'">
        <div class="modal-content" onclick="event.stopPropagation()" style="padding:20px;">
            <img id="detailFoto" style="width:100%; border-radius:15px; margin-bottom:15px;">
            <h3 id="detailNama"></h3>
            <p id="detailKelas"></p>
            <p id="detailWaktu"></p>
            <span id="detailBadge" class="badge"></span>
        </div>
    </div>

</div>

<script>
    let photoBase64 = "";

    // CEK SESSION SAAT REFRESH
    window.onload = () => {
        const session = sessionStorage.getItem('guruLogin');
        if (session === 'true') {
            showView('viewGuru');
        } else {
            showView('viewRole');
        }
    };

    function showView(id) {
        document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        if(id === 'viewGuru') renderTabelGuru();
    }

    // AUTH GURU (RAHASIA)
    function authGuru() {
        const e = document.getElementById('logEmail').value;
        const n = document.getElementById('logNama').value;
        const p = document.getElementById('logPass').value;

        // Kode rahasia sesuai permintaan
        if(e === "deby verona" && n === "vero" && p === "patrobas") {
            sessionStorage.setItem('guruLogin', 'true');
            showView('viewGuru');
        } else {
            alert("Akses Ditolak! Kode Verifikasi Salah.");
        }
    }

    function logoutGuru() {
        sessionStorage.clear();
        location.reload();
    }

    // LOGIKA KAMERA & ABSEN
    function openCamera() {
        const input = document.createElement('input');
        input.type = 'file'; input.accept = 'image/*'; input.capture = 'user';
        input.onchange = e => {
            const reader = new FileReader();
            reader.onload = f => {
                photoBase64 = f.target.result;
                document.getElementById('previewFoto').src = photoBase64;
                document.getElementById('previewFoto').style.display = 'block';
                document.getElementById('btnSubmit').classList.remove('hidden');
            }
            reader.readAsDataURL(e.target.files[0]);
        };
        input.click();
    }

    function prosesAbsenSiswa() {
        const nama = document.getElementById('inNama').value;
        const kelas = document.getElementById('inKelas').value;
        if(!nama || !photoBase64) return alert("Lengkapi data dan foto!");

        const skrg = new Date();
        const jam = skrg.getHours();
        const mnt = skrg.getMinutes();
        const waktuStr = jam.toString().padStart(2, '0') + ":" + mnt.toString().padStart(2, '0');
        
        let status = (jam > 8 || (jam === 8 && mnt > 0)) ? "Terlambat" : "Tepat Waktu";

        const db = JSON.parse(localStorage.getItem('db_sekolah')) || [];
        db.push({ nama, kelas, jam: waktuStr, status, foto: photoBase64 });
        localStorage.setItem('db_sekolah', JSON.stringify(db));

        alert(`Absen berhasil dikirim sebagai ${status}!`);
        location.reload();
    }

    function renderTabelGuru() {
        const db = JSON.parse(localStorage.getItem('db_sekolah')) || [];
        const tbody = document.getElementById('bodyTabelGuru');
        tbody.innerHTML = "";
        let tL = 0, tT = 0;

        db.forEach((s, i) => {
            if(s.status === "Terlambat") tL++; else tT++;
            const badge = s.status === "Terlambat" ? 'bg-danger' : 'bg-success';
            tbody.innerHTML += `
                <tr onclick="openModal(${i})">
                    <td><img src="${s.foto}" class="img-table"></td>
                    <td><strong>${s.nama}</strong><br><small>${s.kelas}</small></td>
                    <td>${s.jam}</td>
                    <td><span class="badge ${badge}">${s.status}</span></td>
                </tr>
            `;
        });
        document.getElementById('sTotal').innerText = db.length;
        document.getElementById('sTepat').innerText = tT;
        document.getElementById('sLambat').innerText = tL;
    }

    function openModal(i) {
        const data = JSON.parse(localStorage.getItem('db_sekolah'))[i];
        document.getElementById('detailFoto').src = data.foto;
        document.getElementById('detailNama').innerText = data.nama;
        document.getElementById('detailKelas').innerText = data.kelas;
        document.getElementById('detailWaktu').innerText = "Absen pukul: " + data.jam;
        const b = document.getElementById('detailBadge');
        b.innerText = data.status;
        b.className = "badge " + (data.status === "Terlambat" ? "bg-danger" : "bg-success");
        document.getElementById('modalDetail').style.display = 'flex';
    }
</script>
</body>
</html>
