<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi PRO - SMA Bahagia Indonesia</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Library untuk Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.185/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root {
            --primary: #6366f1;
            --secondary: #f43f5e;
            --accent: #10b981;
            --warning: #f59e0b;
            --glass: rgba(255, 255, 255, 0.95);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1541339907198-e08759dfc3ef?q=80&w=1000');
            background-size: cover; background-position: center; background-attachment: fixed;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px;
        }

        .container { width: 100%; max-width: 500px; position: relative; }

        /* Custom Popup/Toast */
        #toast {
            position: fixed; top: 20px; right: 20px; padding: 15px 25px; border-radius: 15px;
            color: white; font-weight: 700; z-index: 9999; transform: translateX(200%);
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        #toast.show { transform: translateX(0); }

        /* Card System */
        .card {
            background: var(--glass); backdrop-filter: blur(20px); border-radius: 30px;
            padding: 30px; width: 100%; box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.4); animation: slideUp 0.5s ease;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .hidden { display: none !important; }

        /* Typography */
        h1 { color: white; text-align: center; margin-bottom: 20px; font-weight: 800; }
        h2 { font-size: 1.5rem; margin-bottom: 15px; color: #1e293b; text-align: center; }

        /* Buttons */
        .btn {
            width: 100%; padding: 15px; border: none; border-radius: 15px;
            font-weight: 800; cursor: pointer; transition: 0.3s; font-size: 0.9rem;
            display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px;
        }
        .btn-main { background: var(--primary); color: white; }
        .btn-outline { background: white; color: var(--primary); border: 2px solid var(--primary); }
        .btn-danger { background: var(--secondary); color: white; }
        .btn-accent { background: var(--accent); color: white; }
        .btn-back { background: #f1f5f9; color: #64748b; font-size: 0.8rem; height: 45px; }

        /* Input */
        .input-group { margin-bottom: 15px; position: relative; }
        label { display: block; font-size: 0.7rem; font-weight: 800; color: #475569; margin-bottom: 5px; text-transform: uppercase; }
        input, select {
            width: 100%; padding: 14px; border-radius: 12px; border: 2px solid #e2e8f0; font-size: 1rem; outline: none;
        }
        .eye-icon { position: absolute; right: 15px; top: 35px; cursor: pointer; font-size: 1.2rem; }

        /* Dashboard Guru Mobile List */
        .siswa-list { margin-top: 20px; }
        .siswa-item {
            background: white; border-radius: 20px; padding: 15px; margin-bottom: 12px;
            display: flex; align-items: center; gap: 15px; border: 1px solid #f1f5f9;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .siswa-item img { width: 50px; height: 50px; border-radius: 12px; object-fit: cover; }
        .siswa-info { flex: 1; }
        .siswa-info b { display: block; color: #1e293b; font-size: 0.95rem; }
        .siswa-info span { font-size: 0.75rem; color: #64748b; }
        .status-tag { padding: 4px 10px; border-radius: 8px; font-size: 0.65rem; font-weight: 800; }
        .tag-hadir { background: #dcfce7; color: #10b981; }
        .tag-telat { background: #fee2e2; color: #ef4444; }

        /* Floating Export Menu */
        .export-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }

        .copyright { margin-top: 25px; color: white; font-size: 0.8rem; font-weight: 600; text-align: center; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .circle-c { width: 18px; height: 18px; border: 2px solid white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; }
    </style>
</head>
<body>

    <div id="toast"></div>

    <div class="container">
        <h1>SMA Bahagia Indonesia</h1>

        <!-- VIEW: LOCKED -->
        <div id="vLocked" class="card hidden" style="text-align:center;">
            <div style="font-size:60px;">🔒</div>
            <h2 id="lTitle" style="color:var(--secondary)">Sistem Terkunci</h2>
            <p id="lDesc" style="color:#64748b; margin-bottom:20px;"></p>
            <button class="btn btn-main" onclick="go('vGuruLogin')">Login Admin</button>
        </div>

        <!-- VIEW: MENU UTAMA -->
        <div id="vMain" class="card">
            <h2 style="margin-bottom:5px;">Digital Attendance</h2>
            <p style="text-align:center; color:#64748b; font-size:0.8rem; margin-bottom:20px;">Silakan pilih portal masuk Anda</p>
            <button class="btn btn-main" onclick="gateCheck('vSiswaNIS')">PORTAL SISWA</button>
            <button class="btn btn-outline" onclick="go('vGuruLogin')">DASHBOARD GURU</button>
        </div>

        <!-- VIEW: SISWA NIS -->
        <div id="vSiswaNIS" class="card hidden">
            <h2>Masukan NIS</h2>
            <div class="input-group">
                <label>Nomor Induk Siswa</label>
                <input type="number" id="inNIS" placeholder="Contoh: 12345">
            </div>
            <button class="btn btn-main" onclick="go('vSiswaForm')">Lanjutkan</button>
            <button class="btn btn-back" onclick="go('vMain')">Kembali</button>
        </div>

        <!-- VIEW: SISWA FORM -->
        <div id="vSiswaForm" class="card hidden">
            <h2>Lengkapi Data</h2>
            <div class="input-group"><label>Nama Siswa</label><input type="text" id="inNama" placeholder="Nama Lengkap"></div>
            <div class="input-group"><label>Kelas</label><select id="inKelas"><option>X - Bahagia</option><option>XI - Bahagia</option><option>XII - Bahagia</option></select></div>
            <button class="btn btn-outline" onclick="takePic()">📸 Ambil Foto Selfie</button>
            <img id="prev" style="width:100%; border-radius:20px; margin:15px 0; display:none; border:3px solid white; box-shadow:0 10px 20px rgba(0,0,0,0.1);">
            <button id="btnKirim" class="btn btn-main hidden" onclick="saveData()">Kirim Absensi</button>
            <button class="btn btn-back" onclick="go('vSiswaNIS')">Kembali</button>
        </div>

        <!-- VIEW: SUKSES -->
        <div id="vSuccess" class="card hidden" style="text-align:center;">
            <div style="font-size:50px;">✨</div>
            <h2 style="color:var(--accent)">Berhasil Terkirim!</h2>
            <p style="color:#64748b; margin-bottom:20px;">Data absensi Anda sudah diterima oleh Guru.</p>
            <button class="btn btn-main" onclick="lockUser()">Kembali ke Menu Awal</button>
        </div>

        <!-- VIEW: GURU LOGIN -->
        <div id="vGuruLogin" class="card hidden">
            <h2>Admin Login</h2>
            <div class="input-group"><input type="text" id="gE" placeholder="Username/Email"></div>
            <div class="input-group"><input type="text" id="gN" placeholder="Panggilan"></div>
            <div class="input-group">
                <input type="password" id="gP" placeholder="Password">
                <span class="eye-icon" onclick="togglePass()">👁️‍🗨️</span>
            </div>
            <button class="btn btn-main" onclick="auth()">Lanjut Buka Website</button>
            <button class="btn btn-back" onclick="go('vMain')">Kembali</button>
        </div>

        <!-- VIEW: GURU DASHBOARD (LIST SISWA) -->
        <div id="vGuruDash" class="card hidden">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="font-weight:800;">Daftar Absensi</h3>
                <button onclick="logout()" class="btn-danger" style="border:none; padding:5px 12px; border-radius:8px; font-size:0.7rem; font-weight:800; cursor:pointer;">LOGOUT</button>
            </div>
            
            <div class="siswa-list" id="listSiswa">
                <!-- Data Siswa Muncul Di Sini -->
            </div>

            <button class="btn btn-outline" style="margin-top:20px;" onclick="go('vGuruControl')">⚙️ PANEL KONTROL & TIMER</button>
            
            <div class="export-grid">
                <button class="btn btn-accent" style="font-size:0.7rem;" onclick="exportExcel()">DOWNLOAD EXCEL</button>
                <button class="btn btn-danger" style="font-size:0.7rem;" onclick="exportPDF()">DOWNLOAD PDF</button>
            </div>
        </div>

        <!-- VIEW: GURU CONTROL -->
        <div id="vGuruControl" class="card hidden">
            <h3>Panel Kontrol</h3>
            <div style="background:#f8fafc; padding:15px; border-radius:20px; margin-top:15px;">
                <label>Status Website:</label>
                <div style="display:flex; gap:10px; margin-top:5px;">
                    <button class="btn btn-danger" style="flex:1;" onclick="setGlobal(true)">KUNCI</button>
                    <button class="btn btn-accent" style="flex:1;" onclick="setGlobal(false)">BUKA</button>
                </div>
            </div>
            <div style="background:#f8fafc; padding:15px; border-radius:20px; margin-top:15px;">
                <label>Timer Otomatis (Menit):</label>
                <div style="display:flex; gap:10px; margin-top:5px;">
                    <input type="number" id="tTime" placeholder="Contoh: 10">
                    <button class="btn btn-main" style="width:100px;" onclick="startTimer()">SET</button>
                </div>
            </div>
            <button class="btn btn-back" onclick="go('vGuruDash')">Tutup Panel Kontrol</button>
        </div>

        <div class="copyright">
            <div class="circle-c">c</div> (dibuat oleh Deby Verona)
        </div>
    </div>

<script>
    let photoData = "";

    // POPUP NOTIFIKASI
    function showNotif(msg, color) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.style.backgroundColor = color;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    function go(id) {
        document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        if(id === 'vGuruDash') renderSiswa();
    }

    function gateCheck(target) {
        const gl = localStorage.getItem('gLock') === 'true';
        const ud = localStorage.getItem('uDone') === 'true';
        if(gl) {
            document.getElementById('lTitle').innerText = "Maaf, Sesi Ditutup";
            document.getElementById('lDesc').innerText = "Guru telah menonaktifkan absensi saat ini.";
            go('vLocked');
        } else if(ud) {
            document.getElementById('lTitle').innerText = "Akses Terkunci";
            document.getElementById('lDesc').innerText = "Kamu sudah absen hari ini. Perangkat terkunci secara otomatis.";
            go('vLocked');
        } else { go(target); }
    }

    function togglePass() {
        const p = document.getElementById('gP');
        p.type = p.type === 'password' ? 'text' : 'password';
    }

    // SISWA LOGIC
    function takePic() {
        const i = document.createElement('input'); i.type='file'; i.accept='image/*'; i.capture='user';
        i.onchange = e => {
            const r = new FileReader();
            r.onload = f => {
                photoData = f.target.result;
                const p = document.getElementById('prev');
                p.src = photoData; p.style.display = 'block';
                document.getElementById('btnKirim').classList.remove('hidden');
                showNotif("Foto berhasil diambil!", "var(--accent)");
            };
            r.readAsDataURL(e.target.files[0]);
        };
        i.click();
    }

    function saveData() {
        const n = document.getElementById('inNama').value;
        const k = document.getElementById('inKelas').value;
        if(!n) return showNotif("Nama tidak boleh kosong!", "var(--secondary)");

        const d = new Date();
        const jam = d.getHours().toString().padStart(2,'0') + ":" + d.getMinutes().toString().padStart(2,'0');
        const st = (d.getHours() > 8) ? "Terlambat" : "Hadir";

        let db = JSON.parse(localStorage.getItem('sma_db')) || [];
        db.push({n, k, jam, st, p:photoData});
        localStorage.setItem('sma_db', JSON.stringify(db));
        go('vSuccess');
    }

    function lockUser() {
        localStorage.setItem('uDone', 'true');
        location.reload();
    }

    // GURU LOGIC
    function auth() {
        if(document.getElementById('gE').value === "deby verona" && 
           document.getElementById('gN').value === "vero" && 
           document.getElementById('gP').value === "patrobas") {
            sessionStorage.setItem('isGuru', 'true');
            go('vGuruDash');
            showNotif("Selamat datang, Admin!", "var(--primary)");
        } else { showNotif("Data Login Salah!", "var(--secondary)"); }
    }

    function renderSiswa() {
        const db = JSON.parse(localStorage.getItem('sma_db')) || [];
        const container = document.getElementById('listSiswa');
        container.innerHTML = db.length ? "" : "<p style='text-align:center; color:#94a3b8; margin:20px 0;'>Belum ada data masuk.</p>";
        db.reverse().forEach(s => {
            container.innerHTML += `
                <div class="siswa-item">
                    <img src="${s.p}">
                    <div class="siswa-info">
                        <b>${s.n}</b>
                        <span>${s.k} • ${s.jam} WIB</span>
                    </div>
                    <div class="status-tag ${s.st === 'Hadir' ? 'tag-hadir' : 'tag-telat'}">${s.st}</div>
                </div>
            `;
        });
    }

    function setGlobal(s) {
        localStorage.setItem('gLock', s);
        if(!s) localStorage.removeItem('uDone');
        showNotif(s ? "Website Terkunci!" : "Website Terbuka!", s ? "var(--secondary)" : "var(--accent)");
    }

    function startTimer() {
        const m = document.getElementById('tTime').value;
        if(!m) return;
        localStorage.setItem('eTime', Date.now() + (m * 60000));
        showNotif("Timer dimulai: " + m + " Menit", "var(--warning)");
        setInterval(() => {
            if(localStorage.getItem('eTime') && Date.now() > localStorage.getItem('eTime')) {
                localStorage.setItem('gLock', 'true');
                localStorage.removeItem('eTime');
                location.reload();
            }
        }, 1000);
    }

    // EXPORT EXCEL
    function exportExcel() {
        const db = JSON.parse(localStorage.getItem('sma_db')) || [];
        if(!db.length) return showNotif("Tidak ada data untuk diekspor!", "var(--secondary)");
        const data = db.map(s => ({Nama: s.n, Kelas: s.k, Jam: s.jam, Status: s.st}));
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Absensi");
        XLSX.writeFile(wb, "Absensi_SMA_Bahagia.xlsx");
    }

    // EXPORT PDF
    function exportPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const db = JSON.parse(localStorage.getItem('sma_db')) || [];
        if(!db.length) return showNotif("Tidak ada data!", "var(--secondary)");
        
        doc.text("Laporan Absensi - SMA Bahagia Indonesia", 14, 15);
        const rows = db.map(s => [s.n, s.k, s.jam, s.st]);
        doc.autoTable({ head: [['Nama', 'Kelas', 'Jam', 'Status']], body: rows, startY: 20 });
        doc.save("Laporan_Absensi.pdf");
    }

    function logout() { sessionStorage.clear(); location.reload(); }
</script>
</body>
</html>
