<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Absensi Premium</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:
    linear-gradient(rgba(0,0,0,0.55),rgba(0,0,0,0.55)),
    url('https://images.unsplash.com/photo-1509062522246-3755977927d7?q=80&w=1400');
    background-size:cover;
    background-position:center;
    min-height:100vh;
    padding:20px;
    transition:0.3s;
}

.dark-mode{
    background:#111 !important;
}

.card{
    background:white;
    max-width:900px;
    margin:20px auto;
    padding:25px;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    animation:fade .4s ease;
}

.dark-mode .card{
    background:#1e1e1e;
    color:white;
}

.hidden{
    display:none;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.btn{
    padding:12px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
    margin-top:10px;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn-blue{
    background:#1a73e8;
    color:white;
}

.btn-green{
    background:#16a34a;
    color:white;
}

.btn-red{
    background:#dc2626;
    color:white;
}

.btn-dark{
    background:#222;
    color:white;
}

input,select{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid #ddd;
    margin-top:7px;
    margin-bottom:15px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#1a73e8;
    color:white;
}

th,td{
    padding:12px;
    border-bottom:1px solid #eee;
    font-size:13px;
    text-align:left;
}

.preview{
    width:100%;
    border-radius:15px;
    margin-bottom:15px;
    display:none;
}

.img-preview{
    width:45px;
    height:45px;
    border-radius:10px;
    object-fit:cover;
}

.topbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.badge{
    background:#e8f0fe;
    color:#1a73e8;
    display:inline-block;
    padding:8px 15px;
    border-radius:999px;
    margin-bottom:15px;
    font-size:13px;
}

.qr{
    text-align:center;
    margin-top:15px;
}

@media(max-width:700px){

    table{
        font-size:11px;
    }

    .topbar{
        flex-direction:column;
    }

}

</style>
</head>

<body>

<!-- PILIH ROLE -->
<div id="roleSelection" class="card">

<h1>Sistem Absensi Premium</h1>
<p style="margin:15px 0;color:gray;">
Absensi Digital Sekolah Modern
</p>

<button class="btn btn-blue" style="width:100%;" onclick="showView('viewSiswa')">
Masuk Sebagai Siswa
</button>

<button class="btn btn-dark" style="width:100%;" onclick="showView('viewGuruLogin')">
Masuk Sebagai Guru
</button>

<button class="btn btn-green" style="width:100%;" onclick="toggleDarkMode()">
🌙 Dark Mode
</button>

</div>

<!-- LOGIN SISWA -->
<div id="viewSiswa" class="card hidden">

<h2>Login Siswa</h2>

<input type="text" placeholder="NIS / Username">

<input type="password" placeholder="Password">

<button class="btn btn-blue" style="width:100%;" onclick="showView('viewFormSiswa')">
Login
</button>

</div>

<!-- LOGIN GURU -->
<div id="viewGuruLogin" class="card hidden">

<h2>Login Guru</h2>

<input type="text" id="guruUser" placeholder="Username">

<input type="password" id="guruPass" placeholder="Password">

<button class="btn btn-blue" style="width:100%;" onclick="loginGuru()">
Login Guru
</button>

</div>

<!-- FORM ABSENSI -->
<div id="viewFormSiswa" class="card hidden">

<div class="badge">
📅 <span id="tanggal"></span>
</div>

<h2>Form Kehadiran</h2>

<label>Nama</label>
<input type="text" id="namaSiswa">

<label>Kelas</label>
<select id="kelasSiswa">
<option>X Multimedia</option>
<option>XI RPL</option>
<option>XII TKJ</option>
</select>

<label>Status</label>
<select id="ketSiswa">
<option>Hadir</option>
<option>Izin</option>
<option>Sakit</option>
<option>Alfa</option>
<option>Terlambat</option>
</select>

<button class="btn btn-dark" style="width:100%;" onclick="ambilFoto()">
📸 Selfie
</button>

<img id="previewImg" class="preview">

<div class="qr">
<img src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=ABSENSI-SEKOLAH"
width="140">
<p style="margin-top:10px;font-size:12px;">
QR Absensi Sekolah
</p>
</div>

<button id="btnKirim" class="btn btn-green hidden" style="width:100%;" onclick="kirimAbsen()">
Kirim Absensi
</button>

</div>

<!-- DASHBOARD GURU -->
<div id="viewGuru" class="card hidden">

<div style="display:flex;justify-content:space-between;align-items:center;">
<h2>Dashboard Guru</h2>

<button class="btn btn-red" onclick="showView('roleSelection')">
Keluar
</button>
</div>

<div class="topbar">

<input type="text" id="searchInput" placeholder="🔍 Cari siswa..." onkeyup="renderTabel()">

<select id="filterKelas" onchange="renderTabel()">
<option value="">Semua Kelas</option>
<option>X Multimedia</option>
<option>XI RPL</option>
<option>XII TKJ</option>
</select>

<button class="btn btn-green" onclick="exportExcel()">
Export Excel
</button>

<button class="btn btn-dark" onclick="toggleDarkMode()">
Dark Mode
</button>

</div>

<h3 id="rekapBulanan"></h3>

<table id="tabelGuru">

<thead>
<tr>
<th>Foto</th>
<th>Nama</th>
<th>Kelas</th>
<th>Tanggal</th>
<th>Jam</th>
<th>Status</th>
</tr>
</thead>

<tbody></tbody>

</table>

<button class="btn btn-red" style="width:100%;" onclick="hapusSemuaData()">
Reset Semua Data
</button>

</div>

<script>

let fotoData = "";

document.getElementById('tanggal').innerText =
new Date().toLocaleDateString('id-ID',{
weekday:'long',
year:'numeric',
month:'long',
day:'numeric'
});

function showView(id){

document.querySelectorAll('.card').forEach(card=>{
card.classList.add('hidden');
});

document.getElementById(id).classList.remove('hidden');

if(id === 'viewGuru'){
renderTabel();
}

}

function loginGuru(){

const user = document.getElementById('guruUser').value;
const pass = document.getElementById('guruPass').value;

const encrypted = btoa(pass);

if(user === "guru" && encrypted === btoa("123")){

showView('viewGuru');

}else{

alert("Login gagal!");

}

}

function ambilFoto(){

const input = document.createElement('input');

input.type = 'file';
input.accept = 'image/*';
input.capture = 'user';

input.onchange = e=>{

const reader = new FileReader();

reader.onload = f=>{

fotoData = f.target.result;

document.getElementById('previewImg').src = fotoData;

document.getElementById('previewImg').style.display = 'block';

document.getElementById('btnKirim').classList.remove('hidden');

};

reader.readAsDataURL(e.target.files[0]);

};

input.click();

}

function kirimAbsen(){

const nama = document.getElementById('namaSiswa').value;

const kelas = document.getElementById('kelasSiswa').value;

const ket = document.getElementById('ketSiswa').value;

const jam = new Date().toLocaleTimeString('id-ID',{
hour:'2-digit',
minute:'2-digit'
});

const tanggal = new Date().toLocaleDateString('id-ID');

if(!nama){

alert("Isi nama dulu!");

return;

}

let db = JSON.parse(localStorage.getItem('db_absen')) || [];

db.push({
nama,
kelas,
ket,
jam,
tanggal,
foto:fotoData
});

localStorage.setItem('db_absen',JSON.stringify(db));

alert("Absensi berhasil!");

location.reload();

}

function renderTabel(){

const db = JSON.parse(localStorage.getItem('db_absen')) || [];

const tbody = document.querySelector('#tabelGuru tbody');

tbody.innerHTML = "";

const search = document.getElementById('searchInput').value.toLowerCase();

const filter = document.getElementById('filterKelas').value;

let totalBulanan = 0;

db.forEach(s=>{

if(
s.nama.toLowerCase().includes(search) &&
(filter === "" || s.kelas === filter)
){

totalBulanan++;

tbody.innerHTML += `

<tr>

<td>
<img src="${s.foto}" class="img-preview">
</td>

<td>${s.nama}</td>

<td>${s.kelas}</td>

<td>${s.tanggal}</td>

<td>${s.jam}</td>

<td>${s.ket}</td>

</tr>

`;

}

});

document.getElementById('rekapBulanan').innerHTML =
"📊 Rekap Data: " + totalBulanan + " siswa";

}

function exportExcel(){

const db = JSON.parse(localStorage.getItem('db_absen')) || [];

const ws = XLSX.utils.json_to_sheet(db);

const wb = XLSX.utils.book_new();

XLSX.utils.book_append_sheet(wb,ws,"Absensi");

XLSX.writeFile(wb,"Data_Absensi.xlsx");

}

function hapusSemuaData(){

if(confirm("Hapus semua data absensi?")){

localStorage.removeItem('db_absen');

renderTabel();

}

}

function toggleDarkMode(){

document.body.classList.toggle('dark-mode');

}

</script>

</body>
</html>
