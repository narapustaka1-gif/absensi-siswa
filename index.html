<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Digital - SMA Bahagia Indonesia</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #f43f5e;
            --accent: #10b981;
            --glass: rgba(255, 255, 255, 0.9);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://images.unsplash.com/photo-1523050853063-bd80e27433fb?auto=format&fit=crop&q=80&w=1000');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 35px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.3);
            position: relative;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .hidden { display: none !important; }

        /* Typography */
        h1 { color: white; text-align: center; margin-bottom: 20px; font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        h2 { text-align: center; margin-bottom: 20px; color: #1e293b; }
        .subtitle { text-align: center; font-size: 0.85rem; color: #64748b; margin-bottom: 25px; }

        /* Form Styling */
        .input-group { margin-bottom: 15px; position: relative; }
        label { display: block; font-size: 0.7rem; font-weight: 800; color: #475569; margin-bottom: 5px; text-transform: uppercase; }
        input, select {
            width: 100%; padding: 14px 18px; border-radius: 12px; border: 2px solid #e2e8f0;
            font-size: 1rem; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--primary); }

        /* Eye Art Styling */
        .eye-toggle {
            position: absolute; right: 15px; top: 38px; cursor: pointer;
            font-size: 1.2rem; user-select: none; opacity: 0.6;
        }

        /* Buttons */
        .btn {
            width: 100%; padding: 16px; border: none; border-radius: 15px;
            font-weight: 800; cursor: pointer; transition: 0.3s; font-size: 0.95rem;
            display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px;
        }
        .btn-main { background: var(--primary); color: white; }
        .btn-ghost { background: transparent; color: #475569; border: 2px solid #e2e8f0; }
        .btn-danger { background: var(--secondary); color: white; }
        .btn-back { background: #f1f5f9; color: #64748b; border: none; margin-top: 15px; }

        /* Admin Controls */
        .control-panel { background: #fff; padding: 20px; border-radius: 20px; border: 1px solid #e2e8f0; margin-bottom: 20px; }
        .timer-badge { background: #fee2e2; color: #ef4444; padding: 10px; border-radius: 10px; font-weight: 800; text-align: center; margin-bottom: 15px; }

        /* Table */
        .table-wrap { overflow-x: auto; margin-top: 15px; max-height: 250px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        th { text-align: left; padding: 10px; border-bottom: 2px solid #f1f5f9; color: #64748b; }
        td { padding: 12px 10px; border-bottom: 1px solid #f1f5f9; }
        .avatar { width: 35px; height: 35px; border-radius: 10px; object-fit: cover; }

        /* Copyright */
        .copyright { margin-top: 25px; color: white; font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .circle-c { width: 18px; height: 18px; border: 2px solid white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; }
    </style>
</head>
<body>

    <h1>SMA Bahagia Indonesia</h1>

    <!-- 1. VIEW: LOCKED -->
    <div id="vLocked" class="card hidden" style="text-align:center;">
        <div style="font-size:60px; margin-bottom:15px;">🔒</div>
        <h2 id="lTitle">Akses Ditutup</h2>
        <p id="lDesc" style="color:#64748b; line-height:1.6;"></p>
        <button class="btn btn-main" onclick="go('vGuruLogin')" style="margin-top:20px;">Portal Guru</button>
    </div>

    <!-- 2. VIEW: MENU UTAMA -->
    <div id="vMain" class="card">
        <div id="timerSiswa" class="timer-badge hidden">Sisa Waktu: <span id="timeLeft">00:00</span></div>
        <img src="https://images.unsplash.com/photo-1577896851231-70ef18881754?auto=format&fit=crop&q=80&w=400" style="width:100%; border-radius:20px; margin-bottom:20px;">
        <h2>Portal Kehadiran</h2>
        <button class="btn btn-main" onclick="startCheck('vSiswaNIS')">Siswa: Mulai Absen</button>
        <button class="btn btn-ghost" onclick="go('vGuruLogin')">Login Dashboard Guru</button>
    </div>

    <!-- 3. VIEW: SISWA NIS -->
    <div id="vSiswaNIS" class="card hidden">
        <h2>Verifikasi Identitas</h2>
        <div class="input-group">
            <label>Nomor Induk Siswa (NIS)</label>
            <input type="number" id="inNIS" placeholder="Contoh: 2024001">
        </div>
        <button class="btn btn-main" onclick="go('vSiswaForm')">Lanjutkan</button>
        <button class="btn btn-back" onclick="go('vMain')">← Kembali ke Menu</button>
    </div>

    <!-- 4. VIEW: SISWA FORM -->
    <div id="vSiswaForm" class="card hidden">
        <h2>Lengkapi Data Diri</h2>
        <div class="input-group"><label>Nama Lengkap</label><input type="text" id="inNama" placeholder="Masukkan Nama Sesuai Absen"></div>
        <div class="input-group"><label>Kelas</label>
            <select id="inKelas">
                <option>X - Bahagia 1</option><option>XI - Bahagia 2</option><option>XII - Bahagia 3</option>
            </select>
        </div>
        <button class="btn btn-ghost" onclick="takePic()">📸 Ambil Foto Selfie</button>
        <img id="prev" style="width:100%; border-radius:15px; margin:15px 0; display:none;">
        <button id="btnKirim" class="btn btn-main hidden" onclick="saveData()">Kirim Absensi</button>
        <button class="btn btn-back" onclick="go('vSiswaNIS')">← Edit NIS Kembali</button>
    </div>

    <!-- 5. VIEW: SUKSES -->
    <div id="vSuccess" class="card hidden" style="text-align:center;">
        <div style="font-size:60px; margin-bottom:15px;">✅</div>
        <h2>Absensi Diterima!</h2>
        <p id="succText" style="color:#64748b; margin-bottom:20px;"></p>
        <button class="btn btn-main" onclick="finishLock()">Selesai & Kunci</button>
    </div>

    <!-- 6. VIEW: GURU LOGIN -->
    <div id="vGuruLogin" class="card hidden">
        <h2>Admin Verification</h2>
        <div class="input-group"><label>Username / Email</label><input type="text" id="gE"></div>
        <div class="input-group"><label>Panggilan</label><input type="text" id="gN"></div>
        <div class="input-group">
            <label>Kata Sandi</label>
            <input type="password" id="gP">
            <span class="eye-toggle" onclick="toggleEye('gP')">👁️‍🗨️</span>
        </div>
        <button class="btn btn-main" onclick="auth()">Masuk Dashboard</button>
        <button class="btn btn-back" onclick="go('vMain')">Kembali</button>
    </div>

    <!-- 7. VIEW: GURU DASHBOARD -->
    <div id="vGuruDash" class="card hidden" style="max-width: 650px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h3>Monitoring Real-time</h3>
            <button onclick="logout()" class="badge" style="background:#fee2e2; color:#ef4444; border:none; padding:5px 10px; border-radius:8px; cursor:pointer; font-weight:800;">Logout</button>
        </div>

        <div class="control-panel">
            <label style="font-size:0.7rem; font-weight:800; color:#64748b;">KONTROL SISTEM:</label>
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button class="btn btn-danger" style="margin:0; flex:1;" onclick="setGlobal(true)">BERHENTI (LOCK)</button>
                <button class="btn btn-main" style="margin:0; flex:1; background:var(--accent);" onclick="setGlobal(false)">MULAI (OPEN)</button>
            </div>
            <div style="margin-top:15px; display:flex; gap:10px;">
                <input type="number" id="tIn" placeholder="Menit" style="width:80px;">
                <button class="btn btn-main" style="margin:0;" onclick="setTimer()">AKTIFKAN TIMER</button>
            </div>
        </div>

        <div class="table-wrap">
            <table>
                <thead><tr><th>Foto</th><th>Siswa / Kelas</th><th>Waktu</th><th>Ket</th></tr></thead>
                <tbody id="resList"></tbody>
            </table>
        </div>
    </div>

    <div class="copyright">
        <div class="circle-c">c</div> (dibuat oleh Deby Verona)
    </div>

<script>
    let photo = "";
    let clock;

    window.onload = () => {
        checkGate();
        runTimerLogic();
    };

    function go(id) {
        document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        if(id === 'vGuruDash') renderTable();
    }

    function checkGate() {
        const isGlobal = localStorage.getItem('gLock') === 'true';
        const isUser = localStorage.getItem('uDone') === 'true';
        const guru = sessionStorage.getItem('isGuru');

        if(guru) return;

        if(isGlobal) {
            document.getElementById('lTitle').innerText = "Sesi Berakhir";
            document.getElementById('lDesc').innerText = "Mohon maaf, Guru telah menutup akses absensi untuk sesi ini.";
            go('vLocked');
        } else if(isUser) {
            document.getElementById('lTitle').innerText = "Sudah Absen";
            document.getElementById('lDesc').innerText = "Perangkat ini telah digunakan untuk absen. Terima kasih!";
            go('vLocked');
        }
    }

    function startCheck(id) {
        checkGate();
        if(!document.getElementById('vLocked').classList.contains('hidden')) return;
        go(id);
    }

    // TOGGLE EYE ART
    function toggleEye(id) {
        const x = document.getElementById(id);
        x.type = x.type === 'password' ? 'text' : 'password';
    }

    // ADMIN FUNCTIONS
    function setGlobal(val) {
        localStorage.setItem('gLock', val);
        if(!val) localStorage.removeItem('uDone');
        alert(val ? "Sistem Resmi Ditutup" : "Sistem Resmi Dibuka");
        renderTable(); // Tetap di halaman
    }

    function setTimer() {
        const m = document.getElementById('tIn').value;
        if(!m) return;
        localStorage.setItem('endTime', Date.now() + (m * 60000));
        alert("Timer berhasil dipasang!");
        runTimerLogic();
    }

    function runTimerLogic() {
        clearInterval(clock);
        clock = setInterval(() => {
            const end = localStorage.getItem('endTime');
            if(!end) return;
            const diff = end - Date.now();
            if(diff <= 0) {
                clearInterval(clock);
                localStorage.removeItem('endTime');
                localStorage.setItem('gLock', 'true');
                checkGate();
            } else {
                const m = Math.floor(diff/60000), s = Math.floor((diff%60000)/1000);
                document.getElementById('timerSiswa').classList.remove('hidden');
                document.getElementById('timeLeft').innerText = `${m}:${s.toString().padStart(2,'0')}`;
            }
        }, 1000);
    }

    // SISWA FUNCTIONS
    function takePic() {
        const i = document.createElement('input'); i.type='file'; i.accept='image/*'; i.capture='user';
        i.onchange = e => {
            const r = new FileReader();
            r.onload = f => {
                photo = f.target.result;
                document.getElementById('prev').src = photo;
                document.getElementById('prev').style.display = 'block';
                document.getElementById('btnKirim').classList.remove('hidden');
            };
            r.readAsDataURL(e.target.files[0]);
        };
        i.click();
    }

    function saveData() {
        const n = document.getElementById('inNama').value;
        const k = document.getElementById('inKelas').value;
        if(!n) return alert("Nama wajib diisi!");

        const d = new Date();
        const jam = d.getHours().toString().padStart(2,'0') + ":" + d.getMinutes().toString().padStart(2,'0');
        const st = (d.getHours() > 8 || (d.getHours() === 8 && d.getMinutes() > 0)) ? "Terlambat" : "Hadir";

        let db = JSON.parse(localStorage.getItem('abs_db')) || [];
        db.push({n, k, jam, st, photo});
        localStorage.setItem('abs_db', JSON.stringify(db));

        document.getElementById('succText').innerText = `Data ${n} (${k}) telah tersimpan pada pukul ${jam}.`;
        go('vSuccess');
    }

    function finishLock() {
        localStorage.setItem('uDone', 'true');
        location.reload();
    }

    function auth() {
        if(document.getElementById('gE').value === "deby verona" && 
           document.getElementById('gN').value === "vero" && 
           document.getElementById('gP').value === "patrobas") {
            sessionStorage.setItem('isGuru', 'true');
            go('vGuruDash');
        } else { alert("Akses Ditolak!"); }
    }

    function renderTable() {
        const db = JSON.parse(localStorage.getItem('abs_db')) || [];
        const body = document.getElementById('resList');
        body.innerHTML = "";
        db.reverse().forEach(s => {
            body.innerHTML += `<tr>
                <td><img src="${s.photo}" class="avatar"></td>
                <td><b>${s.n}</b><br><small>${s.k}</small></td>
                <td>${s.jam}</td>
                <td style="color:${s.st==='Hadir'?'#10b981':'#ef4444'}; font-weight:800;">${s.st}</td>
            </tr>`;
        });
    }

    function logout() { sessionStorage.clear(); location.reload(); }
</script>
</body>
</html>
