<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi SMA Bahagia Indonesia</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #f43f5e;
            --accent: #10b981;
            --bg-gradient: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
        }

        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { 
            background: var(--bg-gradient); background-size: 400% 400%; animation: gradientBG 15s ease infinite;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; 
        }

        .header { text-align: center; color: white; margin-bottom: 25px; }
        .header h1 { font-size: 2rem; font-weight: 800; text-shadow: 0 4px 10px rgba(0,0,0,0.2); }

        .card {
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border-radius: 30px;
            padding: 40px; width: 100%; max-width: 480px; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            transition: 0.3s; position: relative;
        }

        .hidden { display: none !important; }

        /* Input & Password Toggle */
        .input-group { margin-bottom: 18px; position: relative; }
        label { display: block; font-size: 0.7rem; font-weight: 800; color: #64748b; margin-bottom: 8px; text-transform: uppercase; }
        input, select {
            width: 100%; padding: 15px 18px; border-radius: 15px; border: 2px solid #f1f5f9;
            font-size: 1rem; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--primary); }
        
        .pass-container { position: relative; }
        .toggle-pass {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            cursor: pointer; font-size: 1.2rem; user-select: none;
        }

        .btn {
            width: 100%; padding: 18px; border: none; border-radius: 15px;
            font-weight: 800; cursor: pointer; transition: 0.3s; font-size: 1rem;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-main { background: var(--primary); color: white; margin-top: 10px; }
        .btn-danger { background: var(--secondary); color: white; }
        .btn-ghost { background: transparent; color: var(--primary); border: 2px solid var(--primary); margin-top: 10px; }

        .timer-display { background: #fee2e2; color: #ef4444; padding: 10px; border-radius: 10px; font-weight: 800; text-align: center; margin-bottom: 20px; }
        .badge { padding: 5px 12px; border-radius: 8px; font-size: 0.7rem; font-weight: 800; }
        .late { background: #fee2e2; color: #ef4444; }
        .ontime { background: #dcfce7; color: #10b981; }

        .copyright { margin-top: 25px; color: white; font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .circle-c { width: 18px; height: 18px; border: 2px solid white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; }

        .table-wrap { overflow-x: auto; margin-top: 15px; max-height: 200px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        td, th { padding: 12px; border-bottom: 1px solid #f1f5f9; text-align: left; }
    </style>
</head>
<body>

    <div class="header">
        <h1>SMA Bahagia Indonesia</h1>
    </div>

    <!-- VIEW: SISTEM TERKUNCI (GLOBAL/INDIVIDUAL) -->
    <div id="vLocked" class="card hidden" style="text-align:center;">
        <div style="font-size:50px;">🔒</div>
        <h2 id="lockTitle" style="color:var(--secondary)">Akses Terkunci</h2>
        <p id="lockDesc" style="margin-top:15px; color:#64748b; line-height: 1.5;"></p>
        <button class="btn btn-ghost" onclick="go('vGuruLogin')">Login Admin</button>
    </div>

    <!-- VIEW: MENU AWAL -->
    <div id="vMain" class="card">
        <div id="timerSiswa" class="timer-display hidden">Sisa Waktu: <span id="timeLeft">00:00</span></div>
        <h2 style="text-align:center; margin-bottom:25px;">Portal Kehadiran</h2>
        <button class="btn btn-main" onclick="checkGate('vSiswaLogin')">Masuk Portal Siswa</button>
        <button class="btn btn-ghost" onclick="go('vGuruLogin')">Dashboard Guru</button>
    </div>

    <!-- VIEW: SISWA NIS -->
    <div id="vSiswaLogin" class="card hidden">
        <h2>Verifikasi NIS</h2>
        <div class="input-group">
            <label>Nomor Induk Siswa</label>
            <input type="number" id="inNIS" placeholder="Masukkan NIS anda">
        </div>
        <button class="btn btn-main" onclick="go('vSiswaForm')">Validasi Data</button>
        <button class="btn btn-ghost" onclick="go('vMain')">Batal</button>
    </div>

    <!-- VIEW: SISWA FORM -->
    <div id="vSiswaForm" class="card hidden">
        <h2>Data Lengkap</h2>
        <div class="input-group"><label>Nama</label><input type="text" id="inNama"></div>
        <div class="input-group"><label>Kelas</label><select id="inKelas"><option>X - Bahagia</option><option>XI - Bahagia</option><option>XII - Bahagia</option></select></div>
        <button class="btn btn-ghost" onclick="takePic()">📸 Ambil Selfie</button>
        <img id="prev" style="width:100%; border-radius:15px; margin:15px 0; display:none; border:2px solid var(--primary);">
        <button id="btnKirim" class="btn btn-main hidden" onclick="saveAbsen()">Kirim Absen</button>
    </div>

    <!-- VIEW: BERHASIL -->
    <div id="vSuccess" class="card hidden" style="text-align:center;">
        <div style="font-size:50px;">✨</div>
        <h2 style="color:var(--accent)">Terima Kasih!</h2>
        <p id="succMsg" style="margin:15px 0;"></p>
        <button class="btn btn-main" onclick="lockAndHome()">Kembali ke Menu Awal</button>
    </div>

    <!-- VIEW: GURU LOGIN -->
    <div id="vGuruLogin" class="card hidden">
        <h2>Admin Login</h2>
        <div class="input-group"><input type="text" id="gE" placeholder="Email"></div>
        <div class="input-group"><input type="text" id="gN" placeholder="Nama"></div>
        <div class="input-group pass-container">
            <input type="password" id="gP" placeholder="Password">
            <span class="toggle-pass" onclick="togglePass('gP')">👁️</span>
        </div>
        <button class="btn btn-main" onclick="authG()">Buka Panel</button>
        <button class="btn btn-ghost" onclick="go('vMain')">Kembali</button>
    </div>

    <!-- VIEW: GURU DASHBOARD -->
    <div id="vGuruDash" class="card hidden" style="max-width: 600px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h3>Admin Panel</h3>
            <button onclick="logout()" class="badge late" style="border:none; cursor:pointer;">Keluar</button>
        </div>
        
        <div style="background:#f8fafc; padding:15px; border-radius:15px; margin-bottom:15px;">
            <label>Kontrol Global:</label>
            <div style="display:flex; gap:10px; margin-top:5px;">
                <button class="btn btn-danger" style="padding:10px; font-size:0.8rem;" onclick="setGlobalLock(true)">Kunci Semua</button>
                <button class="btn btn-main" style="padding:10px; font-size:0.8rem; background:var(--accent);" onclick="setGlobalLock(false)">Buka Semua</button>
            </div>
            <div style="margin-top:15px;">
                <label>Set Timer (Menit):</label>
                <div style="display:flex; gap:10px; margin-top:5px;">
                    <input type="number" id="timerInput" placeholder="Menit" style="padding:10px;">
                    <button class="btn btn-main" style="width:100px; padding:10px; font-size:0.8rem;" onclick="startTimer()">Set</button>
                </div>
            </div>
        </div>

        <div class="table-wrap">
            <table>
                <thead><tr><th>Nama</th><th>Jam</th><th>Status</th></tr></thead>
                <tbody id="listG"></tbody>
            </table>
        </div>
    </div>

    <div class="copyright">
        <div class="circle-c">c</div> (dibuat oleh Deby Verona)
    </div>

<script>
    let currentImg = "";
    let timerInterval;

    window.onload = () => {
        checkGateStatus();
        updateTimerDisplay();
    };

    function go(id) {
        document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        if(id === 'vGuruDash') renderGuru();
    }

    // FUNGSI CEK PINTU MASUK
    function checkGateStatus() {
        const isGlobalLocked = localStorage.getItem('globalLocked') === 'true';
        const isUserLocked = localStorage.getItem('userHasFinished') === 'true';

        if (isGlobalLocked && !sessionStorage.getItem('isGuru')) {
            document.getElementById('lockTitle').innerText = "Sistem Ditutup";
            document.getElementById('lockDesc').innerText = "Mohon maaf, sesi absensi untuk hari ini telah berakhir atau ditutup oleh Admin.";
            go('vLocked');
        } else if (isUserLocked && !sessionStorage.getItem('isGuru')) {
            document.getElementById('lockTitle').innerText = "Absensi Selesai";
            document.getElementById('lockDesc').innerText = "Anda sudah melakukan absensi sebelumnya. Silakan kembali pada sesi berikutnya.";
            go('vLocked');
        }
    }

    function checkGate(target) {
        checkGateStatus();
        const locked = document.getElementById('vLocked').classList.contains('hidden');
        if(locked) go(target);
    }

    function togglePass(id) {
        const el = document.getElementById(id);
        el.type = el.type === 'password' ? 'text' : 'password';
    }

    // ADMIN CONTROL
    function setGlobalLock(status) {
        localStorage.setItem('globalLocked', status);
        if(!status) localStorage.removeItem('userHasFinished'); // Reset kunci individu saat admin buka semua
        alert(status ? "Website DIKUNCI untuk semua siswa." : "Website DIBUKA kembali.");
        location.reload();
    }

    function startTimer() {
        const mins = document.getElementById('timerInput').value;
        if(!mins) return;
        localStorage.setItem('absensiEndTime', Date.now() + (mins * 60000));
        updateTimerDisplay();
    }

    function updateTimerDisplay() {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            const end = localStorage.getItem('absensiEndTime');
            if(!end) return;
            const diff = end - Date.now();
            if(diff <= 0) {
                clearInterval(timerInterval);
                localStorage.removeItem('absensiEndTime');
                localStorage.setItem('globalLocked', 'true');
                checkGateStatus();
            } else {
                document.getElementById('timerSiswa').classList.remove('hidden');
                const m = Math.floor(diff / 60000), s = Math.floor((diff % 60000) / 1000);
                document.getElementById('timeLeft').innerText = `${m}:${s.toString().padStart(2,'0')}`;
            }
        }, 1000);
    }

    // ABSENSI
    function takePic() {
        const inp = document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.capture='user';
        inp.onchange = e => {
            const r = new FileReader();
            r.onload = f => {
                currentImg = f.target.result;
                document.getElementById('prev').src = currentImg;
                document.getElementById('prev').style.display = 'block';
                document.getElementById('btnKirim').classList.remove('hidden');
            };
            r.readAsDataURL(e.target.files[0]);
        };
        inp.click();
    }

    function saveAbsen() {
        const n = document.getElementById('inNama').value;
        const d = new Date();
        const jam = d.getHours().toString().padStart(2,'0') + ":" + d.getMinutes().toString().padStart(2,'0');
        const status = (d.getHours() > 8 || (d.getHours() === 8 && d.getMinutes() > 0)) ? "Terlambat" : "Tepat Waktu";

        let db = JSON.parse(localStorage.getItem('db_final')) || [];
        db.push({n, jam, status, foto:currentImg});
        localStorage.setItem('db_final', JSON.stringify(db));

        document.getElementById('succMsg').innerText = `Data anda (${n}) telah diterima guru.`;
        go('vSuccess');
    }

    // KUNCI HALAMAN SETELAH ABSEN
    function lockAndHome() {
        localStorage.setItem('userHasFinished', 'true'); // Mengunci perangkat ini
        location.reload(); // Akan memicu checkGateStatus() dan menampilkan halaman kunci
    }

    function authG() {
        if(document.getElementById('gE').value === "deby verona" && 
           document.getElementById('gN').value === "vero" && 
           document.getElementById('gP').value === "patrobas") {
            sessionStorage.setItem('isGuru', 'true');
            go('vGuruDash');
        } else { alert("Data Salah!"); }
    }

    function renderGuru() {
        const db = JSON.parse(localStorage.getItem('db_final')) || [];
        const list = document.getElementById('listG');
        list.innerHTML = "";
        db.forEach(s => {
            list.innerHTML += `<tr><td>${s.n}</td><td>${s.jam}</td><td><span class="badge ${s.status === 'Terlambat'?'late':'ontime'}">${s.status}</span></td></tr>`;
        });
    }

    function logout() { sessionStorage.clear(); location.reload(); }
</script>
</body>
</html>
