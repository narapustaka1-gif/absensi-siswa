<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Demo Absensi Mobile</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
        }
        .container { width: 100%; max-width: 400px; }
        .card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 30px;
            padding: 30px 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .title {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        /* Tabs */
        .tabs { display: flex; gap: 10px; margin-bottom: 25px; background: #f0f0f0; padding: 5px; border-radius: 15px; }
        .tab { flex: 1; padding: 10px; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .tab.active { background: white; color: #764ba2; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        /* Inputs */
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 5px; color: #555; }
        input, select {
            width: 100%; padding: 14px; border: 1.5px solid #eee; border-radius: 15px;
            font-size: 1rem; outline: none; transition: 0.3s;
        }
        input:focus { border-color: #667eea; background: #fdfdff; }
        /* Buttons */
        .btn {
            width: 100%; padding: 15px; border: none; border-radius: 15px;
            font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.3s;
        }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; margin-top: 10px; }
        .btn-absen { background: #00b894; color: white; margin-top: 15px; }
        .btn-absen:disabled { background: #bdc3c7; cursor: not-allowed; }
        .btn-logout { background: transparent; color: #ff7675; border: 1.5px solid #ff7675; margin-top: 15px; }
        /* Profile & Status */
        .profile-section { text-align: center; margin-bottom: 20px; }
        .avatar {
            width: 100px; height: 100px; border-radius: 50%; border: 4px solid #667eea;
            object-fit: cover; margin-bottom: 10px; background: #eee;
        }
        .status-badge {
            display: inline-block; padding: 6px 15px; border-radius: 20px;
            font-size: 0.85rem; font-weight: 700; margin-top: 10px;
        }
        .status-ok { background: #e8f8f5; color: #00b894; }
        .status-no { background: #fff5e6; color: #f39c12; }
        /* History */
        .history { margin-top: 25px; border-top: 1px solid #eee; pt: 15px; }
        .history-item {
            display: flex; justify-content: space-between; padding: 10px 0;
            font-size: 0.85rem; border-bottom: 1px dashed #eee;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- LAYAR LOGIN/DAFTAR -->
    <div id="authScreen" class="card">
        <h1 class="title">Demo Absen</h1>
        <div class="tabs">
            <button class="tab active" id="tabLogin">Login</button>
            <button class="tab" id="tabReg">Daftar</button>
        </div>

        <div id="loginForm">
            <div class="form-group">
                <label>Email Demo</label>
                <input type="email" id="logEmail" placeholder="admin@demo.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="logPass" placeholder="12345">
            </div>
            <button class="btn btn-primary" id="btnDoLogin">Masuk Sekarang</button>
        </div>

        <div id="regForm" class="hidden">
            <div class="form-group"><label>Nama</label><input type="text" id="regName"></div>
            <div class="form-group"><label>Email</label><input type="email" id="regEmail"></div>
            <div class="form-group"><label>Sandi</label><input type="password" id="regPass"></div>
            <button class="btn btn-primary" id="btnDoReg">Buat Akun</button>
        </div>
    </div>

    <!-- LAYAR DASHBOARD -->
    <div id="dashScreen" class="card hidden">
        <div class="profile-section">
            <img id="userPhoto" class="avatar" src="https://ui-avatars.com/api/?name=User&background=667eea&color=fff" alt="Avatar">
            <h2 id="userName" style="font-size: 1.3rem;">Nama Siswa</h2>
            <p id="userClass" style="color: #888; font-size: 0.9rem;">Kelas X</p>
            <div id="userStatus" class="status-badge status-no">Belum Absen</div>
        </div>

        <button class="btn" style="background: #f0f0f0; font-size: 0.8rem;" id="btnCapture">📸 Ambil Foto Selfie</button>
        <button class="btn btn-absen" id="btnAbsen">Kirim Absensi</button>
        
        <div class="history">
            <p style="font-weight: 700; font-size: 0.9rem; margin-bottom: 10px;">Riwayat Terbaru:</p>
            <div id="listHistory"></div>
        </div>

        <button class="btn btn-logout" id="btnLogout">Keluar Aplikasi</button>
    </div>

    <footer style="text-align:center; color:white; font-size:0.7rem; margin-top:20px; opacity:0.7;">
        Demo v2.0 - LocalStorage Database
    </footer>
</div>

<script>
    // 1. DATABASE SETUP (Demo Account)
    let users = JSON.parse(localStorage.getItem('users')) || [];
    let logs = JSON.parse(localStorage.getItem('logs')) || [];
    let session = JSON.parse(localStorage.getItem('session')) || null;
    let currentPhoto = null;

    // Tambahkan Akun Demo secara otomatis jika data kosong
    if (users.length === 0) {
        users.push({ name: "Demo User", email: "admin@demo.com", password: "123", class: "XII-IPA" });
        localStorage.setItem('users', JSON.stringify(users));
    }

    // 2. UI HANDLER
    function showScreen() {
        if (session) {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('dashScreen').classList.remove('hidden');
            renderDash();
        } else {
            document.getElementById('authScreen').classList.remove('hidden');
            document.getElementById('dashScreen').classList.add('hidden');
        }
    }

    function renderDash() {
        document.getElementById('userName').innerText = session.name;
        document.getElementById('userClass').innerText = "Kelas: " + session.class;
        
        const today = new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD
        const hasAbsen = logs.find(l => l.email === session.email && l.date === today);
        
        const btnAbsen = document.getElementById('btnAbsen');
        const statusBadge = document.getElementById('userStatus');

        if (hasAbsen) {
            statusBadge.innerText = "Sudah Absen Hari Ini (" + hasAbsen.time + ")";
            statusBadge.className = "status-badge status-ok";
            btnAbsen.disabled = true;
            btnAbsen.innerText = "Absensi Selesai";
            if(hasAbsen.img) document.getElementById('userPhoto').src = hasAbsen.img;
        } else {
            statusBadge.innerText = "Belum Absen Hari Ini";
            statusBadge.className = "status-badge status-no";
            btnAbsen.disabled = false;
        }

        // Render History
        const myLogs = logs.filter(l => l.email === session.email).reverse().slice(0, 3);
        const listHistory = document.getElementById('listHistory');
        listHistory.innerHTML = myLogs.length ? '' : '<p style="color:#ccc; font-size:0.8rem">Belum ada riwayat</p>';
        myLogs.forEach(log => {
            listHistory.innerHTML += `<div class="history-item"><span>📅 ${log.date}</span> <b>${log.time}</b></div>`;
        });
    }

    // 3. ACTION HANDLERS
    document.getElementById('tabLogin').onclick = () => {
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('regForm').classList.add('hidden');
        document.getElementById('tabLogin').classList.add('active');
        document.getElementById('tabReg').classList.remove('active');
    };

    document.getElementById('tabReg').onclick = () => {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('regForm').classList.remove('hidden');
        document.getElementById('tabReg').classList.add('active');
        document.getElementById('tabLogin').classList.remove('active');
    };

    document.getElementById('btnDoLogin').onclick = () => {
        const email = document.getElementById('logEmail').value || 'admin@demo.com';
        const pass = document.getElementById('logPass').value || '123';
        
        const user = users.find(u => u.email === email && u.password === pass);
        if (user) {
            session = user;
            localStorage.setItem('session', JSON.stringify(session));
            showScreen();
        } else {
            alert("Email atau Password salah!");
        }
    };

    document.getElementById('btnDoReg').onclick = () => {
        const n = document.getElementById('regName').value;
        const e = document.getElementById('regEmail').value;
        const p = document.getElementById('regPass').value;
        if(!n || !e || !p) return alert("Lengkapi data!");
        
        users.push({ name: n, email: e, password: p, class: "X" });
        localStorage.setItem('users', JSON.stringify(users));
        alert("Berhasil daftar! Silakan Login.");
        document.getElementById('tabLogin').click();
    };

    document.getElementById('btnCapture').onclick = () => {
        const input = document.createElement('input');
        input.type = 'file'; input.accept = 'image/*'; input.capture = 'user';
        input.onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                currentPhoto = ev.target.result;
                document.getElementById('userPhoto').src = currentPhoto;
                alert("Foto berhasil diambil!");
            };
            reader.readAsDataURL(e.target.files[0]);
        };
        input.click();
    };

    document.getElementById('btnAbsen').onclick = () => {
        if(!currentPhoto) return alert("Ambil foto selfie dulu sebagai bukti!");
        
        const now = new Date();
        logs.push({
            email: session.email,
            date: now.toLocaleDateString('en-CA'),
            time: now.getHours().toString().padStart(2,'0') + ":" + now.getMinutes().toString().padStart(2,'0'),
            img: currentPhoto
        });
        localStorage.setItem('logs', JSON.stringify(logs));
        currentPhoto = null;
        renderDash();
        alert("Absensi berhasil terkirim!");
    };

    document.getElementById('btnLogout').onclick = () => {
        localStorage.removeItem('session');
        location.reload();
    };

    // Mulai Aplikasi
    showScreen();
</script>

</body>
</html>
