<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sistem Absensi Mobile</title>

<!-- EXCEL -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:
    linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
    url('https://images.unsplash.com/photo-1523050854058-8df90110c9f1?q=80&w=1200');
    background-size:cover;
    background-position:center;
    min-height:100vh;
    padding:15px;
    transition:.3s;
}

.dark-mode{
    background:#111 !important;
}

.card{
    background:white;
    width:100%;
    max-width:500px;
    margin:auto;
    margin-top:20px;
    padding:20px;
    border-radius:25px;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
    animation:fade .4s ease;
}

.dark-mode .card{
    background:#1e1e1e;
    color:white;
}

.hidden{
    display:none;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    width:80px;
}

.logo h1{
    font-size:24px;
    margin-top:10px;
}

.logo p{
    color:gray;
    font-size:14px;
}

.btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:15px;
    cursor:pointer;
    margin-top:10px;
    font-weight:bold;
    transition:.3s;
    font-size:15px;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn-blue{
    background:#1a73e8;
    color:white;
}

.btn-green{
    background:#16a34a;
    color:white;
}

.btn-red{
    background:#dc2626;
    color:white;
}

.btn-dark{
    background:#222;
    color:white;
}

input,select{
    width:100%;
    padding:13px;
    border-radius:14px;
    border:1px solid #ddd;
    margin-top:8px;
    margin-bottom:15px;
    font-size:14px;
}

.dark-mode input,
.dark-mode select{
    background:#2a2a2a;
    color:white;
    border:1px solid #444;
}

.preview{
    width:100%;
    border-radius:15px;
    display:none;
    margin-bottom:15px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#1a73e8;
    color:white;
}

th,td{
    padding:10px;
    border-bottom:1px solid #eee;
    font-size:12px;

}

.img-preview{
    width:45px;
    height:45px;
    object-fit:cover;
    border-radius:10px;
}

.badge{
    background:#e8f0fe;
    color:#1a73e8;
    padding:8px 15px;
    border-radius:999px;
    display:inline-block;

}

    display:flex;
    flex-direction:column;
    gap:10px;

.qr{
    text-align:center;

.small{

</style>
</head>

<body>

<!-- MENU AWAL -->
<div id="home" class="card">

<div class="logo">

<img src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png">

<h1>Sistem Absensi</h1>

<p>Versi Mobile Demo</p>

</div>

<button class="btn btn-blue" onclick="showView('siswaLogin')">
Masuk Sebagai Siswa
</button>

<button class="btn btn-dark" onclick="showView('guruLogin')">
Masuk Sebagai Guru
</button>

<button class="btn btn-green" onclick="toggleDarkMode()">
🌙 Dark Mode
</button>

</div>

<!-- LOGIN SISWA -->
<div id="siswaLogin" class="card hidden">

<h2>Login Siswa</h2>

<input type="text" placeholder="Nama / NIS">

<button class="btn btn-blue" onclick="showView('formSiswa')">
Masuk Demo
</button>

<button class="btn btn-dark" onclick="showView('home')">
← Kembali
</button>

</div>

<!-- LOGIN GURU -->
<div id="guruLogin" class="card hidden">

<h2>Login Guru</h2>

<input type="text" placeholder="Nama Guru">

<button class="btn btn-blue" onclick="loginGuru()">
Masuk Dashboard
</button>

<button class="btn btn-dark" onclick="showView('home')">
← Kembali
</button>

</div>

<!-- FORM ABSENSI -->
<div id="formSiswa" class="card hidden">

<div class="badge">
📅 <span id="tanggal"></span>
</div>

<h2>Form Kehadiran</h2>

<label>Nama Lengkap</label>
<input type="text" id="nama">

<label>Kelas</label>
<select id="kelas">
<option>X Multimedia</option>
<option>XI RPL</option>
<option>XII TKJ</option>
</select>

<label>Status</label>
<select id="status">
<option>Hadir</option>
<option>Izin</option>
<option>Sakit</option>
<option>Alfa</option>
<option>Terlambat</option>
</select>

<button class="btn btn-dark" onclick="ambilFoto()">
📸 Selfie
</button>

<img id="preview" class="preview">

<div class="qr">

<img src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=ABSENSI-DEMO"
width="140">

<p class="small">
QR Demo Sekolah
</p>

</div>

<button id="btnKirim" class="btn btn-green hidden" onclick="kirimAbsen()">
Kirim Absensi
</button>

<button class="btn btn-dark" onclick="showView('siswaLogin')">
← Kembali
</button>

</div>

<!-- DASHBOARD GURU -->
<div id="dashboardGuru" class="card hidden">

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">

<h2>Dashboard Guru</h2>

<button class="btn btn-red" style="width:auto;padding:10px 15px;"
onclick="showView('home')">
Keluar
</button>

</div>

<div class="total">

<h2 id="totalSiswa">0</h2>

<p>Total Kehadiran</p>

</div>

<div class="topbar">

<input type="text"
id="search"
placeholder="🔍 Cari siswa..."
onkeyup="renderTable()">

<select id="filter" onchange="renderTable()">
<option value="">Semua Kelas</option>
<option>X Multimedia</option>
<option>XI RPL</option>
<option>XII TKJ</option>
</select>

<button class="btn btn-green" onclick="exportExcel()">
📥 Export Excel
</button>

<button class="btn btn-dark" onclick="toggleDarkMode()">
🌙 Dark Mode
</button>

</div>

<table>

<thead>
<tr>
<th>Foto</th>
<th>Nama</th>
<th>Status</th>
</tr>
</thead>

<tbody id="tbody"></tbody>

</table>

<button class="btn btn-red" onclick="hapusData()">
🗑 Reset Semua Data
</button>

<button class="btn btn-dark" onclick="showView('home')">
← Kembali
</button>

</div>

<script>

let fotoData = "";

document.getElementById('tanggal').innerText =
new Date().toLocaleDateString('id-ID',{
weekday:'long',
day:'numeric',
month:'long',
year:'numeric'
});

function showView(id){

document.querySelectorAll('.card').forEach(card=>{
card.classList.add('hidden');
});

document.getElementById(id).classList.remove('hidden');

if(id === 'dashboardGuru'){
renderTable();
}

}

function loginGuru(){

alert("Mode Demo Guru");

showView('dashboardGuru');

}

function ambilFoto(){

const input = document.createElement('input');

input.type = 'file';
input.accept = 'image/*';
input.capture = 'user';

input.onchange = e=>{

const reader = new FileReader();

reader.onload = f=>{

fotoData = f.target.result;

document.getElementById('preview').src = fotoData;

document.getElementById('preview').style.display = 'block';

document.getElementById('btnKirim').classList.remove('hidden');

};

reader.readAsDataURL(e.target.files[0]);

};

input.click();

}

function kirimAbsen(){

const nama = document.getElementById('nama').value;

const kelas = document.getElementById('kelas').value;

const status = document.getElementById('status').value;

const tanggal = new Date().toLocaleDateString('id-ID');

const jam = new Date().toLocaleTimeString('id-ID',{
hour:'2-digit',
minute:'2-digit'
});

if(!nama){

alert("Nama wajib diisi!");

return;

}

let db = JSON.parse(localStorage.getItem('db_absensi')) || [];

db.push({
nama,
kelas,
status,
tanggal,
jam,
foto:fotoData
});

localStorage.setItem('db_absensi',JSON.stringify(db));

alert("Absensi berhasil!");

location.reload();

}

function renderTable(){

const db = JSON.parse(localStorage.getItem('db_absensi')) || [];

const tbody = document.getElementById('tbody');

tbody.innerHTML = "";

const search =
document.getElementById('search').value.toLowerCase();

const filter =
document.getElementById('filter').value;

let total = 0;

db.forEach(data=>{

if(
data.nama.toLowerCase().includes(search)
&&
(filter === "" || data.kelas === filter)
){

total++;

tbody.innerHTML += `

<tr>

<td>
<img src="${data.foto}" class="img-preview">
</td>

<td>
${data.nama}
<br>
<small>${data.kelas}</small>
<br>
<small>${data.tanggal}</small>
</td>

<td>
${data.status}
<br>
<small>${data.jam}</small>
</td>

</tr>

`;

}

});

document.getElementById('totalSiswa').innerText = total;

}

function exportExcel(){

const db = JSON.parse(localStorage.getItem('db_absensi')) || [];

const ws = XLSX.utils.json_to_sheet(db);

const wb = XLSX.utils.book_new();

XLSX.utils.book_append_sheet(wb,ws,"Absensi");

XLSX.writeFile(wb,"Data_Absensi.xlsx");

}

function hapusData(){

if(confirm("Hapus semua data?")){

localStorage.removeItem('db_absensi');

renderTable();

}

}

function toggleDarkMode(){

document.body.classList.toggle('dark-mode');

}

</script>

</body>
</html>
