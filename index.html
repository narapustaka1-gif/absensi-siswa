<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Quick Absen - Mode Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #eef2f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container { width: 100%; max-width: 400px; }
        .card {
            background: white;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }
        .title {
            text-align: center;
            color: #4a4ae1;
            margin-bottom: 25px;
            font-weight: 800;
            font-size: 1.5rem;
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; color: #555; }
        input, select {
            width: 100%; padding: 14px; border: 2px solid #f0f0f0; border-radius: 15px;
            font-size: 1rem; outline: none; transition: 0.3s; background: #fafafa;
        }
        input:focus { border-color: #4a4ae1; background: white; }
        
        .btn {
            width: 100%; padding: 15px; border: none; border-radius: 15px;
            font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.3s;
        }
        .btn-camera { background: #4a4ae1; color: white; margin-top: 10px; }
        .btn-submit { background: #00d1b2; color: white; margin-top: 15px; display: none; }

        #photoPreview {
            width: 100%; border-radius: 15px; margin-top: 15px; 
            display: none; border: 3px solid #eef2f7;
        }

        /* Layar Sukses */
        .success-screen { text-align: center; display: none; }
        .icon-check { width: 70px; height: 70px; background: #00d1b2; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 0 auto 20px; }
        .lock-notice { color: #ff3860; font-size: 0.8rem; font-weight: 700; margin-top: 25px; padding: 10px; border: 1px dashed #ff3860; border-radius: 10px; }
    </style>
</head>
<body>

<div class="container">
    <!-- FORM ISI DATA (LANGSUNG MUNCUL) -->
    <div id="absensiCard" class="card">
        <h2 class="title">Absensi Siswa</h2>
        
        <div class="form-group">
            <label>Nama Lengkap</label>
            <input type="text" id="inNama" placeholder="Ketik nama kamu...">
        </div>

        <div class="form-group">
            <label>Kelas</label>
            <select id="inKelas">
                <option value="X">Kelas X (Sepuluh)</option>
                <option value="XI">Kelas XI (Sebelas)</option>
                <option value="XII">Kelas XII (Dua Belas)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Keterangan</label>
            <select id="inKet">
                <option value="Tepat Waktu">Tepat Waktu</option>
                <option value="Terlambat">Terlambat</option>
                <option value="Tidak Terlambat">Tidak Terlambat</option>
            </select>
        </div>
        
        <button class="btn btn-camera" onclick="openCamera()">📸 Ambil Foto Selfie</button>
        <img id="photoPreview" alt="Foto Siswa">
        
        <button class="btn btn-submit" id="btnSubmit" onclick="kirimData()">Kirim Absensi Sekarang</button>
    </div>

    <!-- LAYAR TERKUNCI -->
    <div id="lockedCard" class="card success-screen">
        <div class="icon-check">✓</div>
        <h2 style="color: #00d1b2;">Berhasil!</h2>
        <p id="msgSukses" style="margin: 15px 0; color: #555; line-height: 1.5;"></p>
        
        <div style="background: #f9f9f9; padding: 15px; border-radius: 15px; font-size: 0.9rem;">
            <p><strong>Jam:</strong> <span id="resJam"></span></p>
            <p><strong>Status:</strong> <span id="resStatus"></span></p>
        </div>

        <div class="lock-notice">
            🔒 AKSES TERKUNCI<br>Kamu sudah absen hari ini.
        </div>
        <button onclick="resetDemo()" style="margin-top: 20px; background: none; border: none; color: #ccc; cursor: pointer; font-size: 0.7rem;">(Reset Demo untuk Coba Lagi)</button>
    </div>
</div>

<script>
    let capturedPhoto = null;

    // Cek apakah sudah absen hari ini (Auto-Lock)
    window.onload = () => {
        const hasAbsen = localStorage.getItem('demo_absen_hari_ini');
        if (hasAbsen) {
            tampilkanLayarTerkunci();
        }
    };

    function openCamera() {
        const picker = document.createElement('input');
        picker.type = 'file';
        picker.accept = 'image/*';
        picker.capture = 'user'; 
        
        picker.onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                capturedPhoto = ev.target.result;
                const img = document.getElementById('photoPreview');
                img.src = capturedPhoto;
                img.style.display = 'block';
                document.getElementById('btnSubmit').style.display = 'block';
            };
            reader.readAsDataURL(e.target.files[0]);
        };
        picker.click();
    }

    function kirimData() {
        const nama = document.getElementById('inNama').value;
        const ket = document.getElementById('inKet').value;

        if (!nama) return alert("Nama jangan dikosongin ya!");

        const jam = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        
        // Simpan data biar terkunci
        localStorage.setItem('demo_absen_hari_ini', 'true');
        localStorage.setItem('demo_nama', nama);
        localStorage.setItem('demo_jam', jam);
        localStorage.setItem('demo_ket', ket);

        tampilkanLayarTerkunci();
    }

    function tampilkanLayarTerkunci() {
        document.getElementById('absensiCard').style.display = 'none';
        document.getElementById('lockedCard').style.display = 'block';

        const nama = localStorage.getItem('demo_nama');
        document.getElementById('msgSukses').innerText = `Selamat ${nama}, kamu sudah berhasil melakukan absensi!`;
        document.getElementById('resJam').innerText = localStorage.getItem('demo_jam') + " WIB";
        document.getElementById('resStatus').innerText = localStorage.getItem('demo_ket');
    }

    // Fungsi khusus buat kamu biar bisa ngetes berulang kali tanpa hapus cache
    function resetDemo() {
        localStorage.clear();
        location.reload();
    }
</script>

</body>
</html>
