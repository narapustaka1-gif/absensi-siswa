<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Terpadu</title>
    <style>
        /* CSS Gabungan */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f2f5; min-height: 100vh; padding: 20px; }
        .card { background: white; max-width: 450px; margin: 20px auto; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .hidden { display: none; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; margin-bottom: 10px; transition: 0.3s; }
        .btn-blue { background: #1a73e8; color: white; }
        .btn-green { background: #34a853; color: white; }
        .btn-outline { background: transparent; border: 2px solid #1a73e8; color: #1a73e8; }
        input, select { width: 100%; padding: 12px; margin: 8px 0 15px; border: 1px solid #ddd; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 12px; }
        th, td { border-bottom: 1px solid #eee; padding: 10px; text-align: left; }
        .img-preview { width: 40px; height: 40px; border-radius: 5px; object-fit: cover; }
    </style>
</head>
<body>

    <!-- 1. PILIH ROLE (HALAMAN DEPAN SEKALI) -->
    <div id="roleSelection" class="card" style="text-align: center;">
        <h2 style="margin-bottom: 20px;">Selamat Datang</h2>
        <p style="margin-bottom: 20px; color: #666;">Silakan pilih akses masuk:</p>
        <button class="btn btn-blue" onclick="showView('viewSiswa')">Masuk sebagai SISWA</button>
        <button class="btn btn-outline" onclick="showView('viewGuru')">Masuk sebagai GURU</button>
    </div>

    <!-- 2. VIEW SISWA (LOGIN PAJANGAN) -->
    <div id="viewSiswa" class="card hidden">
        <h2 style="color:#1a73e8">Login Siswa</h2>
        <input type="text" placeholder="NIS / Username">
        <input type="password" placeholder="Password">
        <button class="btn btn-blue" onclick="showView('viewFormSiswa')">Login</button>
        <button onclick="showView('roleSelection')" style="background:none; border:none; color:blue; cursor:pointer;">← Kembali</button>
    </div>

    <!-- 3. VIEW FORM ABSENSI -->
    <div id="viewFormSiswa" class="card hidden">
        <h3>Isi Kehadiran</h3>
        <label>Nama</label><input type="text" id="namaSiswa">
        <label>Kelas</label>
        <select id="kelasSiswa">
            <option>X - Multimedia</option>
            <option>XI - RPL</option>
            <option>XII - TKJ</option>
        </select>
        <label>Status</label>
        <select id="ketSiswa">
            <option>Tepat Waktu</option>
            <option>Terlambat</option>
        </select>
        <button class="btn btn-outline" onclick="ambilFoto()">📸 Foto Selfie</button>
        <img id="previewImg" style="width:100%; display:none; border-radius:10px; margin-bottom:10px;">
        <button id="btnKirim" class="btn btn-green hidden" onclick="kirimAbsen()">Kirim Data</button>
    </div>

    <!-- 4. VIEW GURU (DASHBOARD) -->
    <div id="viewGuru" class="card hidden" style="max-width: 600px;">
        <div style="display:flex; justify-content: space-between;">
            <h3>Data Absensi Guru</h3>
            <button onclick="showView('roleSelection')" style="font-size:10px;">Keluar</button>
        </div>
        <table id="tabelGuru">
            <thead>
                <tr>
                    <th>Foto</th>
                    <th>Nama</th>
                    <th>Jam</th>
                    <th>Ket</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <button class="btn btn-blue" style="margin-top:20px;" onclick="hapusSemuaData()">Reset Semua Data</button>
    </div>

    <script>
        let fotoData = "";

        function showView(viewId) {
            // Sembunyikan semua card
            document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
            // Tampilkan yang dipilih
            document.getElementById(viewId).classList.remove('hidden');
            
            if(viewId === 'viewGuru') renderTabel();
        }

        function ambilFoto() {
            const input = document.createElement('input');
            input.type = 'file'; input.accept = 'image/*'; input.capture = 'user';
            input.onchange = e => {
                const reader = new FileReader();
                reader.onload = f => {
                    fotoData = f.target.result;
                    document.getElementById('previewImg').src = fotoData;
                    document.getElementById('previewImg').style.display = 'block';
                    document.getElementById('btnKirim').classList.remove('hidden');
                };
                reader.readAsDataURL(e.target.files[0]);
            };
            input.click();
        }

        function kirimAbsen() {
            const nama = document.getElementById('namaSiswa').value;
            const kelas = document.getElementById('kelasSiswa').value;
            const ket = document.getElementById('ketSiswa').value;
            const jam = new Date().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});

            if(!nama) return alert("Isi nama dulu!");

            // SIMPAN DATA KE LOCALSTORAGE (DATABASE DEMO)
            let db = JSON.parse(localStorage.getItem('db_absen')) || [];
            db.push({ nama, kelas, ket, jam, foto: fotoData });
            localStorage.setItem('db_absen', JSON.stringify(db));

            alert("Selamat " + nama + ", absen berhasil!");
            location.reload(); // Refresh balik ke awal
        }

        function renderTabel() {
            const db = JSON.parse(localStorage.getItem('db_absen')) || [];
            const tbody = document.querySelector('#tabelGuru tbody');
            tbody.innerHTML = "";

            db.forEach(s => {
                tbody.innerHTML += `
                    <tr>
                        <td><img src="${s.foto}" class="img-preview"></td>
                        <td>${s.nama}<br><small>${s.kelas}</small></td>
                        <td>${s.jam}</td>
                        <td>${s.ket}</td>
                    </tr>
                `;
            });
        }

        function hapusSemuaData() {
            if(confirm("Hapus semua rekap absensi?")) {
                localStorage.removeItem('db_absen');
                renderTabel();
            }
        }
    </script>
</body>
</html>
